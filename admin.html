.card{background:#161616;border:1px solid #2a2a2a;border-radius:14px;padding:14px;margin:10px}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.btn{background:#f5c518;color:#000;border:0;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer;width:100%;margin-top:6px}

small{color:#aaa} .gold{color:#f5c518} .green{color:#2ecc71} .red{color:#ff5a5a}

table{width:100%;border-collapse:collapse;font-size:13px} th,td{border-bottom:1px solid #333;padding:8px;text-align:left}

.lock{max-width:420px;margin:40px auto;text-align:center;padding:10px}

</head>

  var html='<div class="card"><h3>Robot Fleet</h3><p><small>Robots do dangerous work. Humans lead.</small></p><input id="rType" placeholder="Robot Type e.g Humanoid Worker"><select id="rLoc"><option>Africa</option><option>Asia</option><option>Europe</option><option>America North</option><option>America South</option><option>Oceania</option><option>Middle East</option></select><button class="btn" id="addRobotBtn">Deploy New Robot</button><div class="grid3">'+ROBOT_FLEET.map(function(r,i){ return '<div class="card layerR"><b>'+r.id+'</b><br>'+esc(r.type)+'<br><small>'+r.loc+' - '+r.status+' - Tasks: '+r.tasks+'</small><p><button class="btn2" data-toggle="'+i+'">'+(r.status==='WORKING'?'Park Robot':'Activate Robot')+'</button><button class="btnG" data-earn="'+i+'">Robot Earn + '+fmt(20)+'</button></p></div>'; }).join('')+'</div><div class="card"><h4>Robot Laws</h4><p>1. Never harm a human.<br>2. Obey human leaders.<br>3. Every action needs proof. No proof = No pay.</p></div></div>';
  document.getElementById('page').innerHTML=html;
  bind('addRobotBtn', function(){ var t=document.getElementById('rType').value.trim(); var loc=document.getElementById('rLoc').value; if(!t) return alert('Robot type required'); ROBOT_FLEET.push({id:'R-'+genId('BOT').slice(-6),type:t,loc:loc,status:'WORKING',tasks:0}); logAct('Robot Deployed',t+' to '+loc); saveLocal(); render(); });
  document.querySelectorAll('[data-toggle]').forEach(function(el){ el.addEventListener('click', function(){ var i=+this.getAttribute('data-toggle'); ROBOT_FLEET[i].status=ROBOT_FLEET[i].status==='WORKING'?'PARKED':'WORKING'; logAct('Robot Toggle',ROBOT_FLEET[i].id); saveLocal(); render(); }); });
  document.querySelectorAll('[data-earn]').forEach(function(el){ el.addEventListener('click', function(){ var i=+this.getAttribute('data-earn'); if(ROBOT_FLEET[i].status!=='WORKING') return alert('Robot is parked'); ROBOT_FLEET[i].tasks++; balances[9].balance+=20; balances[0].balance+=4; logAct('Robot Earn',ROBOT_FLEET[i].id+' +'+fmt(20)); saveLocal(); render(); }); });
}
function renderApprovals(){
  var html='<div class="card"><h3>Approvals Center - Protected</h3><button class="btn2" id="approveAllBtn">APPROVE ALL SAFE PENDING</button><h4>Withdrawals</h4><table><tr><th>ID</th><th>Member</th><th>Amount</th><th>Action</th></tr>'+withdrawQueue.map(function(w,i){return '<tr><td>'+w.id+'</td><td>'+esc(w.member)+'</td><td>'+fmt(w.amount)+'</td><td>'+(w.status==='Pending'?'<button class="btn2" data-aw="'+i+'">Approve</button> <button class="btnR" data-rw="'+i+'">Reject</button>':'<b class="green">'+w.status+'</b>')+'</td></tr>'}).join('')+'</table><h4>KYC</h4><table><tr><th>Member</th><th>Status</th><th>Action</th></tr>'+members.map(function(m,i){return '<tr><td>'+esc(m.name)+' ('+m.id+')</td><td>'+m.kyc+'</td><td>'+(m.kyc==='Pending'?'<button class="btn2" data-ak="'+i+'">Approve</button> <button class="btnR" data-rk="'+i+'">Reject</button>':'<b class="green">Approved</b>')+'</td></tr>'}).join('')+'</table><h4>Deposits</h4><table><tr><th>ID</th><th>Member</th><th>Amount</th><th>Action</th></tr>'+deposits.map(function(d,i){return '<tr><td>'+d.id+'</td><td>'+esc(d.member)+'</td><td>'+fmt(d.amount)+'</td><td>'+(d.status==='Pending'?'<button class="btn2" data-ad="'+i+'">Approve</button>':'<b class="green">'+d.status+'</b>')+'</td></tr>'}).join('')+'</table></div>';
  document.getElementById('page').innerHTML=html;
  bind('approveAllBtn', function(){ approveAll(); });
  document.querySelectorAll('[data-aw]').forEach(function(el){ el.addEventListener('click', function(){ approveW(+this.getAttribute('data-aw')); }); });
  document.querySelectorAll('[data-rw]').forEach(function(el){ el.addEventListener('click', function(){ var i=+this.getAttribute('data-rw'); withdrawQueue[i].status='Rejected'; logAct('Reject',withdrawQueue[i].id); saveLocal(); render(); }); });
  document.querySelectorAll('[data-ak]').forEach(function(el){ el.addEventListener('click', function(){ var i=+this.getAttribute('data-ak'); members[i].kyc='Approved'; logAct('Approve KYC',members[i].name); saveLocal(); render(); }); });
  document.querySelectorAll('[data-rk]').forEach(function(el){ el.addEventListener('click', function(){ var i=+this.getAttribute('data-rk'); members[i].kyc='Rejected'; saveLocal(); render(); }); });
  document.querySelectorAll('[data-ad]').forEach(function(el){ el.addEventListener('click', function(){ var i=+this.getAttribute('data-ad'); deposits[i].status='Approved'; balances[0].balance+=deposits[i].amount; logAct('Approve Deposit',deposits[i].id); saveLocal(); render(); }); });
}
function renderMembers(){
  var html='<div class="card"><h3>Members</h3><input id="mName" placeholder="Name"><select id="mRegion"><option>Africa</option><option>America North</option><option>America South</option><option>Asia</option><option>Europe</option><option>Oceania</option><option>Middle East</option></select><select id="mRole"><option>Human</option><option>Robot Supervisor</option><option>Robot Engineer</option><option>Creator</option><option>Leader</option></select><input id="mBal" type="number" placeholder="Starting Balance"><button class="btn" id="addMemberBtn">Register Member</button><table><tr><th>ID</th><th>Name</th><th>Role</th><th>Region</th><th>KYC</th><th>Balance</th><th>Action</th></tr>'+members.map(function(m,i){return '<tr><td>'+m.id+'</td><td>'+esc(m.name)+'</td><td>'+esc(m.role||'Human')+'</td><td>'+esc(m.region||'')+'</td><td>'+m.kyc+'</td><td>'+fmt(m.bal)+'</td><td><button class="btn2" data-mk="'+i+'">Approve</button> <button class="btnR" data-mr="'+i+'">Remove</button></td></tr>'}).join('')+'</table></div>';
  document.getElementById('page').innerHTML=html;
  bind('addMemberBtn', function(){ var n=document.getElementById('mName').value.trim(); var r=document.getElementById('mRegion').value; var role=document.getElementById('mRole').value; var b=+document.getElementById('mBal').value||0; if(!n) return alert('Name required'); if(b<0) return alert('Balance cannot be negative'); members.push({id:genId('M'),name:n,kyc:'Pending',bal:b,region:r,role:role}); logAct('New Member',n); saveLocal(); render(); });
  document.querySelectorAll('[data-mk]').forEach(function(el){ el.addEventListener('click', function(){ var i=+this.getAttribute('data-mk'); members[i].kyc='Approved'; saveLocal(); render(); }); });
  document.querySelectorAll('[data-mr]').forEach(function(el){ el.addEventListener('click', function(){ var i=+this.getAttribute('data-mr'); if(!confirm('Remove?')) return; members.splice(i,1); saveLocal(); render(); }); });
}
function renderWithdrawals(){ var html='<div class="card"><h3>Withdrawals - Protected</h3><input id="wMem" placeholder="Member ID"><input id="wAmt" type="number" placeholder="Amount"><button class="btn" id="addWBtn">Add Request</button><div class="feed">'+withdrawQueue.map(function(w){return w.id+' '+esc(w.member)+' '+fmt(w.amount)+' - '+w.status}).join('<br>')+'</div></div>'; document.getElementById('page').innerHTML=html; bind('addWBtn', function(){ var m=document.getElementById('wMem').value.trim(); var a=+document.getElementById('wAmt').value; if(!m||!a||a<=0) return alert('Fill all'); withdrawQueue.push({id:genId('W'),member:m,amount:a,status:'Pending'}); logAct('Withdraw Request',m+' '+fmt(a)); saveLocal(); render(); }); }
function renderDeposits(){ var html='<div class="card"><h3>Deposits</h3><input id="dMem" placeholder="Member ID"><input id="dAmt" type="number" placeholder="Amount"><button class="btn" id="addDBtn">Add Deposit</button><table><tr><th>ID</th><th>Member</th><th>Amount</th><th>Status</th></tr>'+deposits.map(function(d){return '<tr><td>'+d.id+'</td><td>'+esc(d.member)+'</td><td>'+fmt(d.amount)+'</td><td>'+d.status+'</td></tr>'}).join('')+'</table></div>'; document.getElementById('page').innerHTML=html; bind('addDBtn', function(){ var m=document.getElementById('dMem').value.trim(); var a=+document.getElementById('dAmt').value; if(!m||!a||a<=0) return alert('Fill all'); deposits.push({id:genId('D'),member:m,amount:a,status:'Pending'}); saveLocal(); render(); }); }
function renderCredits(){ var html='<div class="card"><h3>Credits</h3><input id="cMem" placeholder="Member ID"><input id="cAmt" type="number" placeholder="Amount"><button class="btn" id="addCBtn">Give Credit</button><table><tr><th>ID</th><th>Member</th><th>Amount</th><th>Status</th></tr>'+credits.map(function(c){return '<tr><td>'+c.id+'</td><td>'+esc(c.member)+'</td><td>'+fmt(c.amount)+'</td><td>'+c.status+'</td></tr>'}).join('')+'</table></div>'; document.getElementById('page').innerHTML=html; bind('addCBtn', function(){ var m=document.getElementById('cMem').value.trim(); var a=+document.getElementById('cAmt').value; if(!m||!a||a<=0) return alert('Fill all'); if(a>balances[0].balance) return alert('BLOCKED: Insufficient'); credits.push({id:genId('C'),member:m,amount:a,status:'Approved'}); balances[0].balance-=a; saveLocal(); render(); }); }
function renderSourcing(){ var html='<div class="card"><h3>AI Sourcing</h3><p>Sourced: <b>'+sourcedCount+'</b> | Fraud Blocked: <b class="red">'+fraudBlocked+'</b></p><button class="btn" id="srcBtn">Source One Now</button><div class="feed">'+sourceFeed.join('<br>')+'</div></div>'; document.getElementById('page').innerHTML=html; bind('srcBtn', function(){ autoAISourcing(); }); }
function renderVerification(){ var html='<div class="card"><h3>AI Verification</h3><p>Verified: <b>'+verifiedCount+'</b></p><button class="btn" id="verBtn">Manual Verify Next</button><div id="aiManualMsg"></div><table><tr><th>Task</th><th>Pay</th><th>Status</th><th>Proof</th></tr>'+vers.slice(-25).reverse().map(function(v){return '<tr><td>'+esc(v.id)+'</td><td>'+fmt(v.a)+'</td><td>'+v.s+'</td><td><small>'+esc(v.proof||'-')+'</small></td></tr>'}).join('')+'</table></div>'; document.getElementById('page').innerHTML=html; bind('verBtn', function(){ manualVerify(); }); }
function renderBrain(){ var html='<div class="card"><h3>AI BRAIN</h3><p>Health: <b class="green">'+aiHealth+'%</b> | Decisions: '+aiDecisions+' | Fraud Blocked: '+fraudBlocked+'</p><button class="btn" id="brainSrc">Source One</button><button class="btn2" id="brainVer">Verify One</button><button class="btn" id="brainReb">Rebalance</button><div class="card"><div class="feed">'+feedArr.join('<br>')+'</div></div></div>'; document.getElementById('page').innerHTML=html; bind('brainSrc', function(){ autoAISourcing(); }); bind('brainVer', function(){ autoAIVerification(); }); bind('brainReb', function(){ AIBrain.autoBalance(); saveLocal(); render(); }); }
function renderLive(){ var html='<div class="card"><h3>Live Earnings</h3><input id="leAmt" type="number" placeholder="Amount"><button class="btn" id="liveBtn">Add Live Earning</button><div id="leMsg"></div><p><small>Split: 90% General + 5% Global + 5% Robot Fund.</small></p></div>'; document.getElementById('page').innerHTML=html; bind('liveBtn', function(){ var a=+document.getElementById('leAmt').value; if(!a||a<=0) return alert('Enter amount'); balances[0].balance+=a*0.9; balances[1].balance+=a*0.05; balances[9].balance+=a*0.05; profitToday+=a*0.05; logAct('Live Earning',fmt(a)); saveLocal(); render(); }); }
function renderSupport(){ var html='<div class="card"><h3>Support</h3><p>Support Fund: '+fmt(balances[11].balance)+'</p><input id="supTo" placeholder="To Member ID"><textarea id="supMsg" placeholder="Message..."></textarea><button class="btn" id="supBtn">Send Reply</button><button class="btn2" id="supFundBtn">Add 100 to Support Fund</button><div class="feed">'+feedArr.join('<br>')+'</div></div>'; document.getElementById('page').innerHTML=html; bind('supBtn', function(){ var t=document.getElementById('supMsg').value.trim(); if(!t) return alert('Write message'); logAct('Support',t); saveLocal(); alert('Support sent'); render(); }); bind('supFundBtn', function(){ if(100>balances[0].balance) return alert('Insufficient General'); balances[11].balance+=100; balances[0].balance-=100; saveLocal(); render(); }); }
function renderBackup(){ var html='<div class="card"><h3>Backup - Never Lose Again</h3><button class="btn" id="expJson">Export Backup JSON</button><button class="btn2" id="expCsv">Export CSV</button><p><small>Import Backup:</small></p><input type="file" id="importFile" accept=".json"><button class="btnR" id="wipeBtn">Wipe All Local Data (After Export)</button></div>'; document.getElementById('page').innerHTML=html; bind('expJson', function(){ exportBackup(); }); bind('expCsv', function(){ exportCSV(); }); bind('wipeBtn', function(){ if(!confirm('WIPE ALL? Export first!')) return; localStorage.removeItem('CEDARS_V3'); location.reload(); }); document.getElementById('importFile').addEventListener('change', function(ev){ var f=ev.target.files[0]; if(!f) return; var rd=new FileReader(); rd.onload=function(){ try{ var d=JSON.parse(rd.result); if(d.balances) balances=d.balances; if(d.members) members=d.members; if(d.withdrawQueue) withdrawQueue=d.withdrawQueue; if(d.vers) vers=d.vers; if(d.grids) grids=d.grids; saveLocal(); alert('Backup Restored!'); render(); }catch(e){ alert('Invalid backup file'); } }; rd.readAsText(f); }); }
function exportBackup(){ var data={balances:balances,members:members,withdrawQueue:withdrawQueue,vers:vers,deposits:deposits,credits:credits,grids:grids,ROBOT_FLEET:ROBOT_FLEET,exportedAt:new Date().toISOString()}; var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cedars-backup-'+Date.now()+'.json'; a.click(); }
function exportCSV(){ var rows=[['Type','ID','Member','Amount','Status']]; members.forEach(function(m){ rows.push(['Member',m.id,m.name,m.bal,m.kyc]); }); withdrawQueue.forEach(function(w){ rows.push(['Withdrawal',w.id,w.member,w.amount,w.status]); }); vers.forEach(function(v){ rows.push(['Task',v.id,v.t,v.a,v.s]); }); var csv=rows.map(function(r){return r.join(',')}).join('\n'); var blob=new Blob([csv],{type:'text/csv'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cedars-export-'+Date.now()+'.csv'; a.click(); }
function distributeGlobal(){ var amt=balances[1].balance*0.2; if(amt<=0) return alert('Global empty'); balances[1].balance-=amt; [2,3,4,5,6,7,8,9].forEach(function(idx){ balances[idx].balance+=amt/8; }); logAct('Distribute','Global '+fmt(amt)); saveLocal(); render(); }
function sendToGlobal(i){ if(i===1) return; if(i===10||i===11) return alert('Vault / Support are protected'); var amt=balances[i].balance*0.1; if(amt<=0) return alert('Empty'); balances[i].balance-=amt; balances[1].balance+=amt; logAct('Send to Global',balances[i].name+' '+fmt(amt)); saveLocal(); render(); }
function gridToEngine(id){ var g=grids.find(function(x){return x.id===id}); var amt=g.balance*0.1; if(amt<=0) return alert('Empty'); g.balance-=amt; var map={'America North':2,'America South':3,'Africa':4,'Asia':5,'Europe':6,'Oceania':7,'Middle East':8}; balances[map[g.region]||1].balance+=amt; logAct('Grid->Engine',g.name+' '+fmt(amt)); saveLocal(); render(); }
function gridToGlobal(id){ var g=grids.find(function(x){return x.id===id}); var amt=g.balance*0.05; if(amt<=0) return alert('Empty'); g.balance-=amt; balances[1].balance+=amt; logAct('Grid->Global',g.name+' '+fmt(amt)); saveLocal(); render(); }
function manualVerify(){ var p=vers.find(function(v){return v.s==='Pending' && !v.locked}); if(!p){ alert('No Pending - AI Will Source In 5 Sec'); return; } if(!AIBrain.fraudCheck(p)){ fraudBlocked++; alert('FRAUD BLOCKED'); saveLocal(); render(); return; } p.locked=true; p.proof=AIBrain.generateProof(p.id,'MANUAL'); p.s='Approved'; balances[0].balance+=p.a; balances[1].balance+=p.a*0.05; balances[9].balance+=p.a*0.05; profitToday+=p.a*0.05; verifiedCount++; logAct('Manual Verify',p.id); saveLocal(); render(); }
function autoAISourcing(){ try{ if(!autoAI_ON) return; if(document.getElementById('app').style.display==='none') return; var layer=AIBrain.pickLayer(); var region=AIBrain.pickRegion(); var title=autoSources[Math.floor(Math.random()*autoSources.length)]; var pay=AIBrain.decidePay(layer); var taskId=genId('TASK'); sourcedCount++; vers.push({id:taskId,r:region,t:title+' ['+layer+']',c:layer,a:pay,s:'Pending',proof:'',locked:false}); if(vers.length>200) vers=vers.slice(-200); sourceFeed.unshift('SOURCED '+taskId+' - '+title+' ['+layer+' - '+region+'] '+fmt(pay)); feedArr.unshift('SOURCED '+taskId); logAct('AI Sourcing',taskId); saveLocal(); updTop(); if(['Dashboard','AI Sourcing','AI Verification','Approvals','AI Brain'].indexOf(cur)>-1) render(); }catch(e){} }
function autoAIVerification(){ try{ if(!autoAI_ON) return; if(document.getElementById('app').style.display==='none') return; var p=vers.find(function(v){return v.s==='Pending' && !v.locked}); if(!p) return; if(!AIBrain.fraudCheck(p)){ fraudBlocked++; p.s='Blocked'; logAct('Fraud Blocked',p.id); saveLocal(); return; } p.locked=true; var w='AI-'+String(1+Math.floor(Math.random()*2600)).padStart(4,'0'); p.proof=AIBrain.generateProof(p.id,w); p.s='Approved'; verifiedCount++; aiDecisions++; balances[0].balance+=p.a; balances[1].balance+=p.a*0.05; balances[9].balance+=p.a*0.05; profitToday+=p.a*0.05; feedArr.unshift('VERIFIED '+p.id+' by '+w+' '+fmt(p.a)); logAct('AI Verify',p.id); saveLocal(); updTop(); if(['Dashboard','AI Verification','Approvals','AI Brain'].indexOf(cur)>-1) render(); }catch(e){} }
function approveAll(){ var c=0, blocked=0; withdrawQueue.forEach(function(w){ if(w.status==='Pending'){ if(w.amount<=balances[0].balance){ w.status='Approved'; balances[0].balance-=w.amount; c++; } else { blocked++; } } }); members.forEach(function(m){ if(m.kyc==='Pending'){ m.kyc='Approved'; c++; } }); deposits.forEach(function(d){ if(d.status==='Pending'){ d.status='Approved'; balances[0].balance+=d.amount; c++; } }); logAct('Approve All',c+' approved, '+blocked+' blocked'); saveLocal(); alert('Approved '+c+', Blocked '+blocked); render(); }
function approveW(i){ if(withdrawQueue[i].status!=='Pending') return; if(withdrawQueue[i].amount>balances[0].balance){ alert('BLOCKED: Insufficient General'); return; } withdrawQueue[i].status='Approved'; balances[0].balance-=withdrawQueue[i].amount; logAct('Approve Withdraw',withdrawQueue[i].id); saveLocal(); render(); }
setInterval(autoAISourcing,5000); setInterval(autoAIVerification,1000);
setInterval(function(){ if(document.getElementById('app').style.display!=='none'){ AIBrain.autoBalance(); saveLocal(); updTop(); } },60000);
</script>
</body>
