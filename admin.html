<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cedars - Global Separate</title>
<style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f2f2f2;color:#111}header{background:#111;color:#fff;padding:14px;display:flex;justify-content:space-between}button{padding:10px;border-radius:8px;border:1px solid #111;background:#fff;cursor:pointer;font-weight:800}.wrap{padding:14px;max-width:1000px;margin:auto}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:12px}
.global{border:3px solid #111!important;background:#111!important;color:#fff!important;padding:20px!important;border-radius:16px!important}.global button{background:#fff!important;color:#111!important}.global input{background:#fff;color:#111}
.sub{border:1px solid #999;background:#f9f9f9;border-radius:10px;padding:12px;margin-bottom:8px}
input,select{width:100%;padding:11px;border:1px solid #999;border-radius:8px;margin:6px 0}.switch{width:60px;height:30px;background:#ccc;border-radius:20px;display:inline-block;position:relative;cursor:pointer;border:1px solid #999}.switch:after{content:"";position:absolute;width:24px;height:24px;background:#fff;border-radius:50%;top:2px;left:2px}.switch.on{background:#111}.switch.on:after{left:32px}.switchBig{width:80px;height:40px}.switchBig:after{width:32px;height:32px}.switchBig.on:after{left:44px}
.grid47{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.g47{background:#f9f9f9;border:1px solid #ddd;border-radius:10px;padding:10px;text-align:center}</style></head><body>
<header><b>CEDARS EMPIRE</b><span id="clock">Eastern --:--</span></header>
<div id="login" style="max-width:400px;margin:40px auto;background:#fff;padding:20px;border-radius:12px"><h2>Admin Login</h2><p>PIN: 1234</p><input id="pin" type="password" placeholder="PIN"><button onclick="doLogin()" style="width:100%;background:#111;color:#fff">LOGIN</button></div>
<div id="main" style="display:none"><div style="padding:10px;display:flex;gap:8px"><button id="bA" onclick="show('admin')" style="background:#111;color:#fff">ADMIN</button><button id="bM" onclick="show('member')">MEMBER 360</button><button id="bC" onclick="show('crypto')">47 GRIDS</button></div><div class="wrap" id="app"></div></div>
<script>
let view='admin';
let S=JSON.parse(localStorage.getItem('cedars_global')||'null')||{
global:{on:true,balance:12000,label:"GLOBAL ENGINE - MASTER"},
engines:{
 e1:{on:true,balance:1000,pct:1.0,label:"Engine 1 - New Members"},
 e2:{on:true,balance:2000,pct:1.5,label:"Engine 2 - Gold"},
 e3:{on:true,balance:3000,pct:2.0,label:"Engine 3 - Diamond / VIP"},
 e4:{on:true,balance:500,pct:2.5,label:"Engine 4 - P2P + Tasks"},
 e5:{on:true,balance:800,pct:3.0,label:"Engine 5 - Profit + Redemption"}},
users:[{phone:"+256700000001",name:"Test Member",balance:250,staked:150,plan:"Gold",engine:"e2",enabled:true}],
deposits:[],withdrawals:[],profitHist:[],logs:["System safe"],
grids:Array.from({length:47},(_,i)=>({id:i+1,balance:200+Math.floor(Math.random()*300),on:true}))};
const W={usdt:"TE26B7zQjMbahYAWcxEsSPC6aZEr2Hcz1u",poly:"0x0d4c2B95e8FB7Be3DB9953bAcEf3A4Be643bA77B",bnb:"0x0d4c2B95e8FB7Be3DB9953bAcEf3A4Be643bA77B",usdc:"0x6DB27eE3ccB9c80990c45C7d80e98D08a8995e49"};
function save(){localStorage.setItem('cedars_global',JSON.stringify(S))}function fmt(n){return "£"+Number(n||0).toFixed(2)}
function doLogin(){if(document.getElementById('pin').value=='1234'){document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';render()}}
function show(v){view=v;render()}
function togGlobal(){S.global.on=!S.global.on;save();alert('GLOBAL ENGINE is now '+(S.global.on?'ON - All Sub-Engines CAN work':'OFF - ALL STOPPED'));render()}
function togEng(k){S.engines[k].on=!S.engines[k].on;save();render()}
function savePct(k){S.engines[k].pct=parseFloat(document.getElementById('pct_'+k).value);save();alert(k+' % saved to '+S.engines[k].pct+'%');render()}
function killAll(){if(confirm('STOP GLOBAL + ALL?')){S.global.on=false;Object.values(S.engines).forEach(e=>e.on=false);S.grids.forEach(g=>g.on=false);save();render()}}
function startAll(){S.global.on=true;Object.values(S.engines).forEach(e=>e.on=true);S.grids.forEach(g=>g.on=true);save();render();alert('GLOBAL + ALL STARTED')}
function render(){
let a=document.getElementById('app');
if(view=='crypto'){a.innerHTML=`<div class="card"><h2>47 Grids - Under Global Engine</h2><p>Global must be ON for grids to earn. Global: ${S.global.on?'ON':'OFF'}</p></div><div class="card"><div class="grid47">${S.grids.map((g,i)=>`<div class="g47"><b>GRID ${g.id}</b><br>${fmt(g.balance)}<br>${g.on?'ON':'OFF'}<br><span class="switch ${g.on?'on':''}" onclick="tg(${i})"></span></div>`).join('')}</div></div>`;return}
if(view=='member'){let m=S.users[0];a.innerHTML=`<div class="card"><h2>${m.name}</h2><p>Balance ${fmt(m.balance)} | Staked ${fmt(m.staked)} | Engine ${m.engine.toUpperCase()} ${S.engines[m.engine].pct}%</p><p>Global: ${S.global.on?'ON - You can earn':'OFF - System Paused by Admin'}</p></div><div class="card"><h3>Deposit QR</h3><select id="mNet" onchange="mq()"><option value="usdt">USDT TRC20</option><option value="poly">Polygon</option><option value="bnb">BNB</option><option value="usdc">USDC Polygon</option></select><div id="mq"></div><input id="mAmt" type="number" placeholder="Amount £"><input id="mTx" placeholder="TX Hash"><button onclick="mDep()" style="width:100%;background:#111;color:#fff">Submit Deposit</button></div><div class="card"><h3>Stake Min £100</h3><input id="stAmt" type="number" placeholder="100"><button onclick="mStake()" style="width:100%;background:#111;color:#fff">Stake</button></div>`;mq();return}
let subTotal=Object.values(S.engines).reduce((x,e)=>x+e.balance,0);
let gridTotal=S.grids.reduce((x,g)=>x+g.balance,0);
a.innerHTML=`
<!-- ===== GLOBAL ENGINE - SEPARATE, BIG, BLACK - NOT LIKE SUB ENGINES ===== -->
<div class="card global">
<h1 style="margin:0">🌐 GLOBAL ENGINE - MASTER</h1>
<p style="font-size:13px">This is NOT a Sub-Engine. This is the MASTER switch for the whole Cedars Empire.</p>
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
<div><div style="font-size:12px">GLOBAL BALANCE (Separate)</div><div style="font-size:32px;font-weight:900">${fmt(S.global.balance)}</div><div>General Balance (Global + 5 Subs + 47 Grids): <b>${fmt(S.global.balance+subTotal+gridTotal)}</b></div></div>
<div style="text-align:center"><div>MASTER LIGHT: ${S.global.on?'● ON':'○ OFF'}</div><span class="switch switchBig ${S.global.on?'on':''}" onclick="togGlobal()"></span><div>Tap to Turn Global ON/OFF</div></div>
</div>
<p>${S.global.on?'✅ Global ON → Sub-Engines CAN work (if their own switch is ON)':'⛔ Global OFF → ALL Sub-Engines STOPPED, even if their switch is ON'}</p>
<button onclick="killAll()">EMERGENCY - STOP GLOBAL + ALL</button> <button onclick="startAll()">START GLOBAL + ALL</button>
</div>

<!-- ===== SUB ENGINES - SMALLER, GREY, UNDER GLOBAL ===== -->
<div class="card"><h2>5 SUB-ENGINES - Under Global Engine</h2><p>These are workers under Global. Each has OWN Balance + OWN % + OWN Switch.</p>
${Object.entries(S.engines).map(([k,e])=>`<div class="sub"><b>${e.label}</b> - ${e.on?'ON':'OFF'} <span class="switch ${e.on?'on':''}" onclick="togEng('${k}')"></span><br>Balance: <b>${fmt(e.balance)}</b> | Profit: <input id="pct_${k}" value="${e.pct}" style="width:70px;display:inline"> %/day <button onclick="savePct('${k}')">Save %</button> | Daily: ${fmt(e.balance*e.pct/100)}<br><span style="font-size:12px;color:#666">${!S.global.on?'⛔ Blocked by GLOBAL OFF':e.on?'✅ Working':'⏸️ Paused by its own switch'}</span></div>`).join('')}
<button onclick="distAll()" style="width:100%;background:#111;color:#fff">DISTRIBUTE ALL 5 BY THEIR %</button></div>

<div class="card"><h3>Users 360</h3><p>${S.users.map(u=>`${u.name} - ${fmt(u.balance)} - ${u.engine.toUpperCase()} ${S.engines[u.engine].pct}%`).join('<br>')}</p></div>
<div class="card"><h3>Deposits</h3><select id="dNet" onchange="dq()"><option value="usdt">USDT TRC20</option><option value="poly">Polygon</option><option value="bnb">BNB</option><option value="usdc">USDC Polygon</option></select><div id="dq"></div><input id="dPhone" placeholder="Phone"><input id="dAmt" type="number" placeholder="Amount £"><input id="dTx" placeholder="TX Hash"><button onclick="addDep()" style="width:100%;background:#111;color:#fff">Add Deposit</button><p>${S.deposits.map((d,i)=>`${d.phone} ${fmt(d.amount)} ${d.status} <button onclick="appDep(${i})">Approve</button>`).join('<br>')||'No deposits'}</p></div>
<div class="card"><h3>Profit History</h3><p>${S.profitHist.join('<br>')||'No history'}</p></div>
<div class="card"><h3>Logs</h3><p>${S.logs.join('<br>')}</p></div>`;dq();
}
function tg(i){S.grids[i].on=!S.grids[i].on;save();render()}
function distAll(){if(!S.global.on)return alert('Cannot distribute - GLOBAL is OFF');Object.entries(S.engines).forEach(([k,e])=>{if(e.on){let p=e.balance*e.pct/100;e.balance+=p}});S.profitHist.unshift('All 5 distributed - '+new Date().toLocaleString());save();alert('All 5 Distributed by their %');render()}
function mq(){let k=document.getElementById('mNet').value;let addr=W[k];document.getElementById('mq').innerHTML=`<div style="background:#fff;border:1px solid #111;padding:10px;text-align:center"><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${addr}"><div style="font-size:11px;word-break:break-all">${addr}</div></div>`}
function dq(){let k=document.getElementById('dNet').value;let addr=W[k];let el=document.getElementById('dq');if(el)el.innerHTML=`<div style="background:#fff;border:1px solid #111;padding:10px;text-align:center"><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${addr}"><div style="font-size:11px;word-break:break-all">${addr}</div></div>`}
function mDep(){if(!document.getElementById('mTx').value)return alert('Paste TX Hash');S.deposits.push({phone:S.users[0].phone,amount:+document.getElementById('mAmt').value,status:'Pending'});save();alert('Deposit Submitted');render()}
function mStake(){let a=+document.getElementById('stAmt').value;if(a<100)return alert('Min £100');if(a>S.users[0].balance)return alert('Not enough');S.users[0].balance-=a;S.users[0].staked+=a;save();alert('Staked '+fmt(a));render()}
function addDep(){S.deposits.push({phone:document.getElementById('dPhone').value,amount:+document.getElementById('dAmt').value,status:'Pending'});save();alert('Deposit Added');render()}
function appDep(i){S.deposits[i].status='Approved';let u=S.users.find(x=>x.phone==S.deposits[i].phone);if(u)u.balance+=S.deposits[i].amount;save();alert('Approved');render()}
function tick(){try{let est=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));document.getElementById('clock').textContent='Eastern: '+est.toLocaleTimeString()+' • Credit 12AM';}catch(e){}}setInterval(tick,1000);
</script></body></html>
