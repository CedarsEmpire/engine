<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEDARS EMPIRE - Global Admin 2056</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
.top{position:sticky;top:0;background:#111;padding:12px;border-bottom:2px solid #f5c518;display:flex;gap:8px;flex-wrap:wrap;z-index:99}
.top b{color:#f5c518;font-size:18px;width:100%}
.pill{background:#222;border:1px solid #333;padding:6px 10px;border-radius:20px;font-size:12px}
.pill b{color:#f5c518}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:#141414}
.nav button{background:#222;color:#fff;border:1px solid #444;padding:8px 12px;border-radius:8px;cursor:pointer}
.nav button.on{background:#f5c518;color:#000;font-weight:900}
.card{background:#161616;border:1px solid #2a2a2a;border-radius:14px;padding:14px;margin:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
.btn{background:#f5c518;color:#000;border:0;padding:9px 14px;border-radius:8px;font-weight:900;cursor:pointer;width:100%;margin-top:6px}
.btn2{background:#1e7a34;color:#fff;border:0;padding:9px 14px;border-radius:8px;font-weight:900;cursor:pointer;width:100%;margin-top:6px}
.btnR{background:#b42318;color:#fff;border:0;padding:8px;border-radius:8px;cursor:pointer}
input,select,textarea{width:100%;padding:10px;background:#222;color:#fff;border:1px solid #444;border-radius:8px;margin-top:6px}
small{color:#aaa} .gold{color:#f5c518} .green{color:#2ecc71} .red{color:#ff5a5a}
.feed{max-height:220px;overflow:auto;background:#0f0f0f;padding:10px;border-radius:10px;font-size:13px;line-height:1.7}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{border-bottom:1px solid #333;padding:8px;text-align:left}
.layerU{border-left:4px solid #8b5cf6} .layerE{border-left:4px solid #2ecc71} .layerC{border-left:4px solid #3498db} .layerH{border-left:4px solid #f5c518}
</style>
</head>
<body>

<div class="top">
<b>👑 CEDARS EMPIRE - GLOBAL ADMIN | 2056 VISION</b>
<span class="pill">Global Engine: £<b id="tGlobal">0</b></span>
<span class="pill">General: £<b id="tGeneral">0</b></span>
<span class="pill">Profit Today: £<b id="tProfit">0</b></span>
<span class="pill">⏳ Approvals: <b id="tAppr">0</b></span>
<span class="pill">🤖 AI: <b id="tAI">ON</b></span>
<span class="pill">🌍 Grids Live: <b>47 / 47</b></span>
</div>

<div class="nav" id="nav"></div>
<div id="page"></div>

<script>
var cur='Dashboard';
var profitToday=0, sourcedCount=0, verifiedCount=0, autoTaskNum=1, autoAI_ON=true;
var balances=[
 {name:'General',balance:12500},
 {name:'Global Engine',balance:8500},
 {name:'America Engine',balance:2200},
 {name:'Africa Engine',balance:1800},
 {name:'Asia Engine',balance:2400},
 {name:'Europe Engine',balance:1900},
 {name:'Oceania Engine',balance:900},
 {name:'Middle East Engine',balance:1100},
 {name:'Grid Vault',balance:0},
 {name:'Support Fund',balance:500},
];
var members=[{id:'M-001',name:'Demo Member',kyc:'Pending',bal:50}];
var withdrawQueue=[{id:'W-001',member:'M-001',amount:100,status:'Pending'}];
var vers=[{id:'TASK-001',r:'Africa',t:'Earth Solar Install [Earth]',c:'Earth',a:8,s:'Pending'}];
var feedArr=[], sourceFeed=[];
var autoSources=['Underground Mining Data','Geothermal Energy','Deep Tunnel Cable','Earth Solar Install','Smart Farm Data','Ocean Port Logistics','Cloud AI Training','Satellite Mapping','Quantum Compute','Human Translation','Human Design','Human Delivery','Space Debris Tracking','Desert Greening','Nile Water Data'];
var autoRegions=['America North','America South','Africa','Asia','Europe','Oceania','Middle East'];
var autoLayers=['Underground','Earth','Cloud','Human'];

// ===== 47 CRYPTOLOGY GRIDS - 30 YEAR ARCHITECTURE =====
var grids=[];
var gridDefs=[
 // UNDERGROUND 1-12
 [1,'Underground Mining','Underground','Africa'],[2,'Geothermal Power','Underground','Asia'],[3,'Deep Data Tunnels','Underground','Europe'],[4,'Underground Water','Underground','Africa'],[5,'Bunker Storage','Underground','America North'],[6,'Subsea Cables','Underground','Oceania'],[7,'Oil & Gas Deep','Underground','Middle East'],[8,'Rare Earth Mining','Underground','Asia'],[9,'Underground Transport','Underground','Europe'],[10,'Seismic Data','Underground','America South'],[11,'Deep Carbon Capture','Underground','Africa'],[12,'Underground Vault','Underground','Europe'],
 // EARTH 13-24
 [13,'Solar Farms','Earth','Africa'],[14,'Smart Farms','Earth','Asia'],[15,'City Logistics','Earth','America North'],[16,'Ports & Shipping','Earth','Asia'],[17,'Green Housing','Earth','Europe'],[18,'Roads & EV Charge','Earth','America South'],[19,'Forest & Carbon','Earth','Oceania'],[20,'Desert Greening','Earth','Middle East'],[21,'Water Rivers','Earth','Africa'],[22,'Markets & Trade','Earth','Asia'],[23,'Factories 4.0','Earth','Europe'],[24,'Hospitals Earth','Earth','America North'],
 // CLOUD 25-36
 [25,'AI Training','Cloud','America North'],[26,'Satellite Network','Cloud','Europe'],[27,'Quantum Cloud','Cloud','Asia'],[28,'Blockchain Ledger','Cloud','Middle East'],[29,'Drone Network','Cloud','Africa'],[30,'Cyber Security','Cloud','Europe'],[31,'Cloud Storage','Cloud','America South'],[32,'Metaverse Work','Cloud','Asia'],[33,'Space Data','Cloud','Oceania'],[34,'Robotics Cloud','Cloud','America North'],[35,'Weather AI','Cloud','Africa'],[36,'Global Payments','Cloud','Europe'],
 // HUMAN 37-47
 [37,'Human Translation','Human','Asia'],[38,'Human Design','Human','Europe'],[39,'Human Delivery','Human','Africa'],[40,'Human Teaching','Human','America South'],[41,'Human Health','Human','Africa'],[42,'Human Builders','Human','Middle East'],[43,'Human Creators','Human','America North'],[44,'Human Drivers','Human','Asia'],[45,'Human Support','Human','Oceania'],[46,'Human Research','Human','Europe'],[47,'Human Leaders','Human','Africa'],
];
gridDefs.forEach(function(d){ grids.push({id:d[0],name:d[1],layer:d[2],region:d[3],balance:Math.floor(Math.random()*500)+100, tasks:Math.floor(Math.random()*20)+5, status:'LIVE'}); });

var pages=['Dashboard','Engines','47 Grids','Approvals','Members','Withdrawals','AI Sourcing','AI Verification','Live Earnings','Support'];
function navRender(){
 var h=''; pages.forEach(function(p){ h+='<button class="'+(cur===p?'on':'')+'" onclick="go(\''+p+'\')">'+p+'</button>'; });
 document.getElementById('nav').innerHTML=h;
}
function go(p){cur=p; render();}
function updTop(){
 document.getElementById('tGlobal').innerText=balances[1].balance.toFixed(2);
 document.getElementById('tGeneral').innerText=balances[0].balance.toFixed(2);
 document.getElementById('tProfit').innerText=profitToday.toFixed(2);
 var appr=withdrawQueue.filter(function(w){return w.status==='Pending'}).length + members.filter(function(m){return m.kyc==='Pending'}).length + vers.filter(function(v){return v.s==='Pending'}).length;
 document.getElementById('tAppr').innerText=appr;
 document.getElementById('tAI').innerText=autoAI_ON?'ON':'OFF';
}
function logAct(a,m){ feedArr.unshift('• '+a+' - '+m); if(feedArr.length>40) feedArr.pop(); }
function addToFeed(t){ feedArr.unshift(t); }
function addToSourceFeed(t){ sourceFeed.unshift(t); }

function render(){
 navRender(); updTop();
 var p=document.getElementById('page'); if(!p) return;
 if(cur==='Dashboard') return renderDashboard();
 if(cur==='Engines') return renderEngines();
 if(cur==='47 Grids') return renderAllGrids();
 if(cur==='Approvals') return renderApprovals();
 if(cur==='Members') return renderMembers();
 if(cur==='Withdrawals') return renderWithdrawals();
 if(cur==='AI Sourcing') return renderSourcing();
 if(cur==='AI Verification') return renderVerification();
 if(cur==='Live Earnings') return renderLive();
 if(cur==='Support') return renderSupport();
 p.innerHTML='<p>Page not found</p>';
}

function renderDashboard(){
 var totalGridBal=grids.reduce(function(a,g){return a+g.balance},0);
 var wPend=withdrawQueue.filter(function(w){return w.status==='Pending'});
 var html='<div class="card"><h3>🏠 Admin Home - 90% Approvals + Support | 30-Year Engine</h3><p>Clear queues = Happy members. Every grid feeds Global. Global feeds continents.</p>'+
 '<div class="grid4">'+
 '<div class="card" style="text-align:center"><b>⏳ Total Approvals</b><br><span style="font-size:32px" class="gold">'+(wPend.length+members.filter(function(m){return m.kyc==="Pending"}).length+vers.filter(function(v){return v.s==="Pending"}).length)+'</span></div>'+
 '<div class="card" style="text-align:center"><b>🔎 Sourced</b><br><span style="font-size:32px" class="green">'+sourcedCount+'</span></div>'+
 '<div class="card" style="text-align:center"><b>✅ Verified</b><br><span style="font-size:32px" class="green">'+verifiedCount+'</span></div>'+
 '<div class="card" style="text-align:center"><b>🌍 47 Grids Value</b><br><span style="font-size:22px" class="gold">£'+totalGridBal.toFixed(0)+'</span></div></div>'+
 '<div class="grid3"><div class="card"><b>⚙️ Global Engine</b><p>£'+balances[1].balance.toFixed(2)+'</p><input id="geAmt" type="number" placeholder="Amount"><button class="btn" onclick="addEngine(1)">+ Add to Global</button><button class="btn2" onclick="distributeGlobal()">🌍 Distribute to 7 Sub-Engines</button></div>'+
 '<div class="card"><b>🤖 AI Auto - 5 Sec Sourcing / 1 Sec Verify</b><p>Status: '+(autoAI_ON?'🟢 ON':'🔴 OFF')+'</p><button class="btn" onclick="toggleAI()">Toggle AI</button><button class="btn2" onclick="manualVerify()">✅ Manual Verify Next</button><div id="aiManualMsg"></div></div>'+
 '<div class="card"><b>📡 Live Feed</b><div class="feed">'+feedArr.join('<br>')+'</div></div></div>'+
 '<h3 style="padding:0 10px">🌍 Engines Snapshot</h3><div class="grid4">'+balances.slice(2,9).map(function(b){return '<div class="card"><b>'+b.name+'</b><br><span class="gold">£'+b.balance.toFixed(2)+'</span></div>'}).join('')+'</div>'+
 '<h3 style="padding:0 10px">🧬 Grids by Layer - 2056</h3><div class="grid4">'+
 '<div class="card layerU"><b>⛏️ Underground</b><br>Grids 1-12<br>£'+grids.filter(function(g){return g.layer==='Underground'}).reduce(function(a,g){return a+g.balance},0).toFixed(0)+'</div>'+
 '<div class="card layerE"><b>🌍 Earth</b><br>Grids 13-24<br>£'+grids.filter(function(g){return g.layer==='Earth'}).reduce(function(a,g){return a+g.balance},0).toFixed(0)+'</div>'+
 '<div class="card layerC"><b>☁️ Cloud</b><br>Grids 25-36<br>£'+grids.filter(function(g){return g.layer==='Cloud'}).reduce(function(a,g){return a+g.balance},0).toFixed(0)+'</div>'+
 '<div class="card layerH"><b>👥 Human</b><br>Grids 37-47<br>£'+grids.filter(function(g){return g.layer==='Human'}).reduce(function(a,g){return a+g.balance},0).toFixed(0)+'</div></div>'+
 '<div class="card"><button class="btn" onclick="go(\'47 Grids\')">View All 47 Grids →</button></div></div>';
 document.getElementById('page').innerHTML=html;
}

function renderEngines(){
 var html='<div class="card"><h3>⚙️ Global + 7 Sub-Engines</h3><p>Global is the mother. Sub-engines are children. If one continent is down, others carry the world.</p><div class="grid3">'+balances.map(function(b,i){
  return '<div class="card"><b>'+b.name+'</b><p class="gold">£'+b.balance.toFixed(2)+'</p><input id="ba'+i+'" type="number" placeholder="Amount"><button class="btn" onclick="addBal('+i+')">+ Add Balance</button><button class="btn2" onclick="sendToGlobal('+i+')">Send 10% to Global</button></div>';
 }).join('')+'</div></div>';
 document.getElementById('page').innerHTML=html;
}
function renderAllGrids(){
 var filter=window.gridFilter||'All';
 var list=grids.filter(function(g){ return filter==='All'||g.layer===filter; });
 var html='<div class="card"><h3>🧬 All 47 Cryptology Grids - Underground / Earth / Cloud / Human</h3>'+
 '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" onclick="setFilter(\'All\')">All 47</button><button class="btn" onclick="setFilter(\'Underground\')">⛏️ Underground 1-12</button><button class="btn" onclick="setFilter(\'Earth\')">🌍 Earth 13-24</button><button class="btn" onclick="setFilter(\'Cloud\')">☁️ Cloud 25-36</button><button class="btn" onclick="setFilter(\'Human\')">👥 Human 37-47</button></div><p>Showing: <b>'+filter+'</b> - '+list.length+' grids</p><div class="grid3">'+
 list.map(function(g){
  var cls=g.layer==='Underground'?'layerU':g.layer==='Earth'?'layerE':g.layer==='Cloud'?'layerC':'layerH';
  return '<div class="card '+cls+'"><b>#'+g.id+' '+g.name+'</b><br><small>'+g.layer+' • '+g.region+' • 🟢 '+g.status+'</small><p>Balance: <b class="gold">£'+g.balance.toFixed(2)+'</b> | Tasks: '+g.tasks+'</p><input id="g'+g.id+'" type="number" placeholder="Amount"><button class="btn" onclick="addGrid('+g.id+')">+ Add to Grid</button><button class="btn2" onclick="gridToEngine('+g.id+')">→ Send to '+g.region+' Engine</button></div>';
 }).join('')+'</div></div>';
 document.getElementById('page').innerHTML=html;
}
function setFilter(f){ window.gridFilter=f; render(); }
function renderApprovals(){
 var html='<div class="card"><h3>✅ Approvals Center - 90% Job</h3><p>Approve fast. Support fast.</p>'+
 '<h4>Withdrawals Pending</h4><table><tr><th>ID</th><th>Member</th><th>Amount</th><th>Action</th></tr>'+withdrawQueue.map(function(w,i){return '<tr><td>'+w.id+'</td><td>'+w.member+'</td><td>£'+w.amount+'</td><td>'+(w.status==='Pending'?'<button class="btn2" onclick="approveW('+i+')">Approve</button> <button class="btnR" onclick="rejectW('+i+')">Reject</button>':'<b class="green">'+w.status+'</b>')+'</td></tr>'}).join('')+'</table>'+
 '<h4>KYC Pending</h4><table><tr><th>Member</th><th>Status</th><th>Action</th></tr>'+members.map(function(m,i){return '<tr><td>'+m.name+'</td><td>'+m.kyc+'</td><td>'+(m.kyc==='Pending'?'<button class="btn2" onclick="approveKYC('+i+')">Approve KYC</button>':'<b class="green">Approved</b>')+'</td></tr>'}).join('')+'</table>'+
 '<h4>Tasks Pending Verification</h4><table><tr><th>Task</th><th>Region</th><th>Pay</th><th>Action</th></tr>'+vers.filter(function(v){return v.s==='Pending'}).map(function(v){return '<tr><td>'+v.id+' '+v.t+'</td><td>'+v.r+'</td><td>£'+v.a+'</td><td><button class="btn2" onclick="manualVerify()">Verify</button></td></tr>'}).join('')+'</table></div>';
 document.getElementById('page').innerHTML=html;
}
function renderMembers(){
 var html='<div class="card"><h3>👥 Members</h3><input id="mName" placeholder="New Member Name"><input id="mBal" type="number" placeholder="Starting Balance"><button class="btn" onclick="addMember()">+ Register Member</button><table><tr><th>ID</th><th>Name</th><th>KYC</th><th>Balance</th></tr>'+members.map(function(m){return '<tr><td>'+m.id+'</td><td>'+m.name+'</td><td>'+m.kyc+'</td><td>£'+m.bal+'</td></tr>'}).join('')+'</table></div>';
 document.getElementById('page').innerHTML=html;
}
function renderWithdrawals(){
 var html='<div class="card"><h3>💸 Withdrawals</h3><input id="wMem" placeholder="Member ID"><input id="wAmt" type="number" placeholder="Amount"><button class="btn" onclick="addWithdraw()">+ Add Withdraw Request</button><div class="feed">'+withdrawQueue.map(function(w){return w.id+' '+w.member+' £'+w.amount+' - '+w.status}).join('<br>')+'</div></div>';
 document.getElementById('page').innerHTML=html;
}
function renderSourcing(){
 var html='<div class="card"><h3>🔎 AI Sourcing - Auto Every 5 Sec</h3><p>Sourced: <b>'+sourcedCount+'</b> | Last: '+ (sourceFeed[0]||'None') +'</p><div class="feed">'+sourceFeed.join('<br>')+'</div><button class="btn" onclick="autoAISourcing()">🔎 Source One Now</button></div>';
 document.getElementById('page').innerHTML=html;
}
function renderVerification(){
 var html='<div class="card"><h3>✅ AI Verification - Auto Every 1 Sec</h3><p>Verified: <b>'+verifiedCount+'</b></p><button class="btn" onclick="manualVerify()">Manual Verify Next</button><div id="aiManualMsg"></div><table><tr><th>Task</th><th>Pay</th><th>Status</th></tr>'+vers.slice(-20).reverse().map(function(v){return '<tr><td>'+v.id+'</td><td>£'+v.a+'</td><td>'+v.s+'</td></tr>'}).join('')+'</table></div>';
 document.getElementById('page').innerHTML=html;
}
function renderLive(){
 var html='<div class="card"><h3>⚡ Live Earnings</h3><input id="leAmt" type="number" placeholder="Amount"><button class="btn" onclick="liveAdd()">+ Add Live Earning</button><div id="leMsg"></div></div>';
 document.getElementById('page').innerHTML=html;
}
function renderSupport(){
 var html='<div class="card"><h3>💬 Support Center</h3><p>Support Fund: £'+balances[9].balance.toFixed(2)+'</p><textarea id="supMsg" placeholder="Support message to member..."></textarea><button class="btn" onclick="sendSupport()">Send Support Reply</button><div class="feed">'+feedArr.join('<br>')+'</div></div>';
 document.getElementById('page').innerHTML=html;
}

// ===== ACTIONS - NO BUTTON LEFT BEHIND =====
function addBal(i){ var v=+document.getElementById('ba'+i).value||0; if(v<=0) return alert('Invalid amount'); balances[i].balance+=v; logAct('Add Balance',balances[i].name+' +£'+v); alert('Added'); render(); }
function addEngine(i){ var v=+document.getElementById('geAmt').value||0; if(v<=0) return alert('Invalid'); balances[i].balance+=v; logAct('Engine Add',balances[i].name+' +£'+v); render(); }
function distributeGlobal(){ var amt=balances[1].balance*0.2; if(amt<=0) return alert('Global empty'); balances[1].balance-=amt; for(var i=2;i<=8;i++) balances[i].balance+=amt/7; logAct('Distribute','Global distributed £'+amt.toFixed(2)+' to 7 engines'); render(); }
function sendToGlobal(i){ var amt=balances[i].balance*0.1; balances[i].balance-=amt; balances[1].balance+=amt; logAct('Send to Global',balances[i].name+' → Global £'+amt.toFixed(2)); render(); }
function addGrid(id){ var v=+document.getElementById('g'+id).value; if(!v) return; var g=grids.find(function(x){return x.id===id}); g.balance+=v; g.tasks++; balances[8].balance+=v; balances[0].balance+=v*0.1; updTop(); logAct('Grid Add','Grid #'+id+' '+g.name+' +£'+v); render(); }
function gridToEngine(id){ var g=grids.find(function(x){return x.id===id}); var amt=g.balance*0.1; if(amt<=0) return; g.balance-=amt; var map={'America North':2,'America South':2,'Africa':3,'Asia':4,'Europe':5,'Oceania':6,'Middle East':7}; var ei=map[g.region]||1; balances[ei].balance+=amt; balances[1].balance+=amt*0.1; logAct('Grid→Engine',g.name+' → '+balances[ei].name+' £'+amt.toFixed(2)); render(); }
function toggleAI(){ autoAI_ON=!autoAI_ON; render(); }
function manualVerify(){ var p=vers.find(function(v){return v.s==='Pending'}); if(!p){alert('No Pending - AI Will Source In 5 Sec'); return;} p.s='Approved'; balances[0].balance+=p.a; balances[1].balance+=p.a*0.1; profitToday+=p.a*0.1; verifiedCount++; var el=document.getElementById('aiManualMsg'); if(el) el.innerHTML='✅ Verified '+p.id+' - £'+p.a; logAct('Manual Verify',p.id); render(); }
function autoAISourcing(){ if(!autoAI_ON) return; var title=autoSources[Math.floor(Math.random()*autoSources.length)]; var region=autoRegions[Math.floor(Math.random()*autoRegions.length)]; var layer=autoLayers[Math.floor(Math.random()*autoLayers.length)]; var pay=3+Math.floor(Math.random()*8); var taskId='TASK-AUTO-'+String(autoTaskNum++).padStart(3,'0'); sourcedCount++; vers.push({id:taskId,r:region,t:title+' ['+layer+']',c:layer,a:pay,s:'Pending'}); addToSourceFeed('🔎 SOURCED '+taskId+' - '+title+' ['+layer+' - '+region+'] £'+pay); addToFeed('🔎 SOURCED '+taskId+' - Waiting...'); logAct('AI Sourcing',taskId); updTop(); if(['Dashboard','AI Sourcing','AI Verification','Approvals'].indexOf(cur)>-1) render(); }
function autoAIVerification(){ if(!autoAI_ON) return; var p=vers.find(function(v){return v.s==='Pending'}); if(!p) return; var worker='AI-'+String(1+Math.floor(Math.random()*2600)).padStart(4,'0'); var proof='PROOF-'+p.id+'-'+worker+'-'+Date.now(); p.s='Approved'; verifiedCount++; balances[0].balance+=p.a; balances[1].balance+=p.a*0.1; profitToday+=p.a*0.1; addToFeed('✅ VERIFIED '+p.id+' by '+worker+' - £'+p.a+' - '+proof); logAct('AI Verify',p.id); updTop(); if(['Dashboard','AI Verification','Approvals'].indexOf(cur)>-1) render(); }
function liveAdd(){ var a=+document.getElementById('leAmt').value; if(!a) return; balances[0].balance+=a; balances[1].balance+=a*0.05; updTop(); document.getElementById('leMsg').innerHTML='✅ Live Earning +£'+a; logAct('Live Earning','£'+a); }
function approveW(i){ withdrawQueue[i].status='Approved'; balances[0].balance-=withdrawQueue[i].amount; logAct('Approve Withdraw',withdrawQueue[i].id); render(); }
function rejectW(i){ withdrawQueue[i].status='Rejected'; logAct('Reject Withdraw',withdrawQueue[i].id); render(); }
function approveKYC(i){ members[i].kyc='Approved'; logAct('Approve KYC',members[i].name); render(); }
function addMember(){ var n=document.getElementById('mName').value; var b=+document.getElementById('mBal').value||0; if(!n) return alert('Name required'); members.push({id:'M-'+String(members.length+1).padStart(3,'0'),name:n,kyc:'Pending',bal:b}); logAct('New Member',n); render(); }
function addWithdraw(){ var m=document.getElementById('wMem').value; var a=+document.getElementById('wAmt').value; if(!m||!a) return alert('Fill all'); withdrawQueue.push({id:'W-'+String(withdrawQueue.length+1).padStart(3,'0'),member:m,amount:a,status:'Pending'}); logAct('Withdraw Request',m+' £'+a); render(); }
function sendSupport(){ var t=document.getElementById('supMsg').value; if(!t) return; logAct('Support Reply',t); alert('Support sent'); render(); }

render();
setInterval(autoAISourcing,5000); autoAISourcing();
setInterval(autoAIVerification,1000);
</script>
</body>
</html>
