if(view=='sources'){ a.innerHTML=`<div class="card"><h2>🌍 SOURCES - Where Tasks Come From</h2><table><tr><th>Source</th><th>Type</th><th>Tasks</th><th>Verified</th><th>Earned £</th></tr><tr><td>Lagos Businesses - Web Scrape</td><td>Data</td><td>1240</td><td>1180</td><td>${fmt(5900)}</td></tr><tr><td>Nairobi Jobs - Job Board</td><td>Job</td><td>980</td><td>940</td><td>${fmt(2820)}</td></tr><tr><td>Online Tasks - App Store</td><td>Task</td><td>860</td><td>810</td><td>${fmt(1620)}</td></tr><tr><td>Kampala Data - WhatsApp</td><td>Data</td><td>640</td><td>610</td><td>${fmt(2440)}</td></tr><tr><td>Telegram Data - Telegram Group</td><td>Data</td><td>520</td><td>490</td><td>${fmt(980)}</td></tr></table></div>`; return; }
if(view=='staking'){ a.innerHTML=`<div class="card"><h2>Staking - Min £100</h2><p>Total Staked: ${fmt(totalStaked)}</p><input id="stPhone" placeholder="User Phone"><input id="stAmt" type="number" placeholder="100"><button onclick="doStake()" style="background:#fff;color:#111;width:100%">Stake Now</button></div><div class="card"><h3>All Stakes</h3>${S.users.map(u=>`${u.name} - Staked ${fmt(u.staked)} - Plan ${u.plan}`).join('<br>')}</div>`; return; }
if(view=='redeem'){ a.innerHTML=`<div class="card"><h2>Redemption Codes</h2><input id="rcN" placeholder="New Code"><input id="rcA" type="number" placeholder="Amount £"><button onclick="genCode()" style="background:#fff;color:#111;width:100%">Generate Code</button><p>${S.redeemCodes.map(c=>`${c.code} - ${fmt(c.amount)} - ${c.used?'USED':'ACTIVE'}`).join('<br>')}</p></div>`; return; }
if(view=='deposits'){ a.innerHTML=`<div class="card"><h2>Deposits - QR</h2><select id="dNet" onchange="dq()"><option value="usdt">USDT TRC20</option><option value="poly">Polygon</option><option value="bnb">BNB</option><option value="usdc">USDC Polygon</option></select><div id="dq"></div><input id="dPhone" placeholder="Phone"><input id="dAmt" type="number" placeholder="Amount £"><input id="dTx" placeholder="TX Hash"><button onclick="addDep()" style="background:#fff;color:#111;width:100%">Add Deposit to Supabase</button></div><div class="card"><h3>Deposits List</h3>${S.deposits.map((d,i)=>`${d.phone} - ${fmt(d.amount)} - ${d.status} <button onclick="appDep(${i})">Approve</button>`).join('<br>')||'No deposits'}</div>`; dq(); return; }
if(view=='withdraw'){ a.innerHTML=`<div class="card"><h2>Withdrawals + Fees</h2><p>Fees: ${fmt(S.fees)} | Fee 2%</p><input id="wPhone" placeholder="Phone"><input id="wAmt" type="number" placeholder="Amount £"><input id="wWallet" placeholder="Wallet"><button onclick="addWith()" style="background:#fff;color:#111;width:100%">Add Withdrawal</button><p>${S.withdrawals.map((w,i)=>`${w.phone} - ${fmt(w.amount)} - ${w.status} <button onclick="appWith(${i})">Pay</button>`).join('<br>')||'No withdrawals'}</p></div>`; return; }
if(view=='kyc'){ a.innerHTML=`<div class="card"><h2>KYC Management</h2><input id="kName" placeholder="Name"><button onclick="addKYC()" style="background:#fff;color:#111;width:100%">Add KYC</button><p>${S.kycList.map(k=>k.name+' - '+k.status).join('<br>')||'No KYC'}</p></div>`; return; }
if(view=='wallet'){ a.innerHTML=`<div class="card"><h2>Wallet Unlock</h2><p>Locked: ${fmt(S.locked)}</p><input id="wuPhone" placeholder="Phone"><input id="wuAmt" type="number" placeholder="Amount £"><button onclick="unlockWallet()" style="background:#fff;color:#111;width:100%">Unlock Wallet</button><p>${S.walletUnlock.map(w=>w.phone+' unlocked '+fmt(w.amount)).join('<br>')||'No unlocks'}</p></div>`; return; }
if(view=='p2p'){ a.innerHTML=`<div class="card"><h2>P2P - Escrow</h2><input id="pFrom" placeholder="From"><input id="pTo" placeholder="To"><input id="pAmt" type="number" placeholder="Amount £"><button onclick="addP2P()" style="background:#fff;color:#111;width:100%">Send P2P Escrow</button><p>${S.p2p.map(p=>p.from+' → '+p.to+' '+fmt(p.amount)+' '+p.status).join('<br>')||'No P2P'}</p></div>`; return; }
if(view=='users'){ a.innerHTML=`<div class="card"><h2>Users 360</h2><table><tr><th>User</th><th>Balance</th><th>Staked</th><th>Engine / %</th><th>KYC</th><th>Enable</th></tr>${S.users.map((u,i)=>`<tr><td>${u.name}<br>${u.phone}</td><td>${fmt(u.balance)}</td><td>${fmt(u.staked)}</td><td>${u.engine.toUpperCase()} - ${(S.engines[u.engine]||{}).pct||0}%</td><td>${u.kyc}</td><td><span class="switch ${u.enabled?'on':''}" onclick="togUser(${i})"></span></td></tr>`).join('')}</table></div><div class="card"><h3>Credit User</h3><input id="cPhone" placeholder="Phone"><input id="cAmt" type="number" placeholder="Amount £"><button onclick="credit()" style="background:#fff;color:#111;width:100%">Credit User</button></div>`; return; }
if(view=='profit'){ a.innerHTML=`<div class="card"><h2>Profit Share - Unlimited</h2><p>Unlimited: ON - No Cap</p><input id="pool" type="number" placeholder="Profit Pool £"><button onclick="distProfit()" style="background:#fff;color:#111;width:100%">Distribute Weighted</button><p>${S.profitHist.join('<br>')||'No history'}</p></div>`; return; }
if(view=='settings'){ a.innerHTML=`<div class="card"><h2>Settings - Never Reset Lock ON</h2><p>Admin PIN: 1234 | Min Staking: £100 | Credit: 12AM Eastern | Supabase: ${sbOK?'Connected':'Paste Keys'} | Auto-Earn: ${S.autoEarn?'ON':'OFF'} | Never Reset: LOCKED - Balances Accumulate Forever</p><button onclick="exportCSV()" style="background:#fff;color:#111">Export CSV Backup</button><p>Logs:<br>${S.logs.join('<br>')}</p></div>`; return; }
}
async function savePct(k){ S.engines[k].pct=parseFloat(document.getElementById('pct_'+k).value); save(); render(); }
async function distAll(){ if(!S.global.on) return alert('GLOBAL OFF'); for(let k of ['e1','e2','e3','e4','e5']){ if(S.engines[k].on){ let p=S.engines[k].balance*S.engines[k].pct/100; S.engines[k].balance+=p; } } S.profitHist.unshift('All 5 distributed - '+new Date().toLocaleString()); save(); alert('All 5 Distributed'); render(); }
function killAll(){ if(confirm('STOP GLOBAL + ALL? Balance will be SAVED, NOT reset.')){ S.global.on=false; Object.values(S.engines).forEach(e=>e.on=false); S.grids.forEach(g=>g.on=false); S.aiWorkers.forEach(w=>w.status='Paused'); save(); render(); } }
function startAll(){ S.global.on=true; Object.values(S.engines).forEach(e=>e.on=true); S.grids.forEach(g=>g.on=true); S.aiWorkers.forEach(w=>w.status='Working'); S.autoEarn=true; save(); render(); alert('GLOBAL + ALL STARTED - Making Money Now - Never Reset'); }
function tg(i){ S.grids[i].on=!S.grids[i].on; save(); render(); }
function togUser(i){ S.users[i].enabled=!S.users[i].enabled; save(); render(); }
function togAI(i){ S.aiWorkers[i].status = S.aiWorkers[i].status=='Working'?'Paused':'Working'; save(); render(); }
function startAI(){ if(!S.global.on) return alert('GLOBAL OFF'); S.aiWorkers.forEach(w=>w.status='Working'); save(); render(); }
function stopAI(){ S.aiWorkers.forEach(w=>w.status='Paused'); save(); render(); }
function addAI(){ S.aiWorkers.push({id:S.aiWorkers.length+1,name:document.getElementById('aiName').value,job:document.getElementById('aiJob').value,status:'Working',tasks:0,verified:0,earned:0}); save(); render(); }
function runSourcing(){ if(!S.global.on) return alert('GLOBAL OFF'); alert('AI Sourcing Running - New Data/Jobs/Tasks Found'); S.sourcingLog.unshift(new Date().toLocaleTimeString()+' - AI Sourcing Run - New items found'); save(); render(); }
function runVerify(){ if(!S.global.on) return alert('GLOBAL OFF'); alert('AI Verification Running'); render(); }
function aiApprove(i){ let pay=[5,3][i]||2; S.verifyHist.unshift({task:'TASK-10'+(i+1),worker:'AI Worker 004',user:'+256700000001',source:['Lagos Businesses - Web Scrape','Nairobi Jobs - Job Board'][i]||'-',result:'Approved',earning:pay,life:'Paid - Life Complete',time:'Just Now'}); save(); alert('AI Approved - Earned £'+pay); render(); }
function aiReject(i){ S.verifyHist.unshift({task:'TASK-10'+(i+1),worker:'AI Worker 005',user:'+256700000002',source:'Nairobi Jobs - Job Board',result:'Rejected - Wrong Proof',earning:0,life:'Rejected - No Pay',time:'Just Now'}); save(); alert('AI Rejected'); render(); }
function takeTask(i){ if(S.availableTasks[i].left<=0) return alert('No slots'); S.availableTasks[i].left--; save(); alert('Task Taken - Submit for AI Verification'); render(); }
function addTask(){ S.availableTasks.push({id:'TASK-'+(100+S.availableTasks.length+1),title:document.getElementById('tTitle').value,type:'Task',pay:+document.getElementById('tPay').value,slots:+document.getElementById('tSlots').value,left:+document.getElementById('tSlots').value,status:'Open',source:document.getElementById('tSource').value}); save(); alert('Task Added'); render(); }
function dq(){ let k=document.getElementById('dNet').value; let addr=W[k]; let el=document.getElementById('dq'); if(el) el.innerHTML=`<div style="background:#fff;color:#111;padding:10px;text-align:center;border-radius:10px"><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${addr}"><div style="font-size:11px;word-break:break-all">${addr}</div></div>` }
async function addDep(){ let amt=+document.getElementById('dAmt').value; if(sbOK) await sb.from('deposits').insert({phone:document.getElementById('dPhone').value,amount:amt,tx_hash:document.getElementById('dTx').value,status:'Pending'}); else S.deposits.push({phone:document.getElementById('dPhone').value,amount:amt,status:'Pending'}); save(); alert('Deposit Added'); render(); }
async function appDep(i){ let d=S.deposits[i]; d.status='Approved'; save(); alert('Approved'); render(); }
function doStake(){ let ph=document.getElementById('stPhone').value; let amt=+document.getElementById('stAmt').value; if(amt<100) return alert('Min £100'); let u=S.users.find(x=>x.phone==ph); if(!u) return alert('User not found'); if(amt>u.balance) return alert('Not enough'); u.balance-=amt; u.staked+=amt; S.locked+=amt; save(); alert('Staked '+fmt(amt)); render(); }
function genCode(){ S.redeemCodes.push({code:document.getElementById('rcN').value,amount:+document.getElementById('rcA').value,used:false}); save(); render(); }
function addKYC(){ S.kycList.push({name:document.getElementById('kName').value,status:'Pending'}); save(); render(); }
function addWith(){ let amt=+document.getElementById('wAmt').value; S.withdrawals.push({phone:document.getElementById('wPhone').value,amount:amt,status:'Pending'}); S.fees+=amt*0.02; save(); render(); }
function appWith(i){ S.withdrawals[i].status='Paid'; save(); render(); }
function unlockWallet(){ let amt=+document.getElementById('wuAmt').value; S.walletUnlock.push({phone:document.getElementById('wuPhone').value,amount:amt}); S.locked=Math.max(0,S.locked-amt); save(); render(); }
function addP2P(){ if(document.getElementById('pFrom').value==document.getElementById('pTo').value) return alert('Cannot send to self'); S.p2p.push({from:document.getElementById('pFrom').value,to:document.getElementById('pTo').value,amount:+document.getElementById('pAmt').value,status:'Escrow'}); save(); render(); }
function credit(){ let ph=document.getElementById('cPhone').value; let amt=+document.getElementById('cAmt').value; let u=S.users.find(x=>x.phone==ph); if(u) u.balance+=amt; else S.users.push({phone:ph,name:ph,balance:amt,staked:0,plan:'-',kyc:'Pending',engine:'e1',enabled:true}); save(); render(); }
function distProfit(){ let p=+document.getElementById('pool').value; S.profitHist.unshift('Pool '+fmt(p)+' Distributed - '+new Date().toLocaleString()); S.users.forEach(u=>u.balance+=p*0.1); save(); render(); }
function exportCSV(){ let csv="phone,name,balance\n"+S.users.map(u=>`${u.phone},${u.name},${u.balance}`).join("\n"); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv])); a.download='cedars-backup.csv'; a.click(); }
render(); loadSB();
</script></body></html>
