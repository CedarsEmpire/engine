<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Admin Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Users</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Trades</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <div class="container mt-5">
      <div class="row">
        <div class="col-md-6">
          <h2>Users</h2>
          <table class="table table-striped" id="user-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody id="user-table-body"></tbody>
          </table>
        </div>
        <div class="col-md-6">
          <h2>Trades</h2>
          <table class="table table-striped" id="trade-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>User ID</th>
                <th>Trade Type</th>
              </tr>
            </thead>
            <tbody id="trade-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.5/dist/umd/supabase.js"></script>
  <script>
    const supabaseUrl = 'https://your/bucket.supabase.co';
    const supabaseKey = 'your-supabase-key';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // Fetch users and trades
    supabase.from('users').select('*').then(data => {
      const userTableBody = document.getElementById('user-table-body');
      data.forEach(user => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${user.id}</td>
          <td>${user.name}</td>
          <td>${user.email}</td>
        `;
        userTableBody.appendChild(row);
      });
    });

    supabase.from('trades').select('*').then(data => {
      const tradeTableBody = document.getElementById('trade-table-body');
      data.forEach(trade => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${trade.id}</td>
          <td>${trade.user_id}</td>
          <td>${trade.trade_type}</td>
        `;
        tradeTableBody.appendChild(row);
      });
    });
  </script>
</body>
</html>
