<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEDARS EMPIRE - Admin - Supabase</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{background:#050816;color:#fff;padding:10px;padding-bottom:70px}
.header{background:#0f172a;padding:14px;border-radius:16px;text-align:center;border:1px solid #334155}
.card{background:#1e293b;padding:14px;border-radius:16px;margin:12px 0;border:1px solid #334155}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:14px}
button{background:#22c55e;color:#000;font-weight:800;cursor:pointer;border:none}
button.blue{background:#38bdf8;color:#000}button.red{background:#f87171;color:#fff}button.yellow{background:#facc15;color:#000}button.purple{background:#a855f7;color:#fff}
.small{font-size:12px;color:#cbd5e1}.hidden{display:none}
table{width:100%;font-size:11px;border-collapse:collapse}th,td{padding:6px;border-bottom:1px solid #334155;text-align:left}
#errorBox{background:#7f1d1d;color:#fff;padding:10px;border-radius:12px;font-size:12px;display:none;margin:12px 0}
#okBox{background:#14532d;color:#fff;padding:10px;border-radius:12px;font-size:12px;display:none;margin:12px 0}
.topbar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.topbar button{flex:1}
</style>
</head>
<body>

<div class="header"><h1>CEDARS EMPIRE - ADMIN</h1><p class="small">Supabase Login - V14 Fixed</p></div>

<div id="errorBox"></div>
<div id="okBox"></div>

<div class="topbar">
<button class="purple" onclick="goHome()">Shareholder Dashboard →</button>
<button class="red" id="topLogoutBtn" onclick="doLogout()">Logout</button>
</div>

<!-- LOGIN CARD - ALWAYS VISIBLE UNTIL LOGIN -->
<div class="card" id="loginCard">
<h2>Admin Login</h2>
<input id="adminEmail" type="email" placeholder="Admin Email" value="ogwal.bemmanuel@gmail.com" autocomplete="email">
<input id="adminPass" type="password" placeholder="Admin Password" autocomplete="current-password">
<button id="loginBtn" onclick="doLogin()">Login as Admin</button>
<button class="yellow" onclick="doForgot()">Forgot Password</button>
<p class="small" id="loginMsg"></p>
<p class="small">Test: If you click Login, you must see "Trying login..." below. If you see nothing, JS is dead.</p>
</div>

<!-- DASHBOARD - HIDDEN UNTIL LOGIN -->
<div id="dashCard" class="hidden">
<div class="card"><h2>Welcome Admin</h2><p class="small">Logged in as: <b id="whoAmI">-</b></p><button class="blue" onclick="loadUsers()">REFRESH USERS</button><button onclick="approveAllLocal()">APPROVE ALL</button></div>
<div class="card"><h2>All Users</h2><table><thead><tr><th>Name</th><th>Email</th><th>Balance</th></tr></thead><tbody id="adminUsers"><tr><td colspan="3">No users loaded</td></tr></tbody></table></div>
<div class="card"><h2>Admin Actions</h2><button class="blue" onclick="exportCSV()">EXPORT CSV</button><button class="yellow" onclick="doLogout()">LOGOUT</button></div>
</div>

<!-- KEEP ALL YOUR OLD FUNCTIONS HERE - NOT DELETED -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== 1. YOUR SUPABASE KEYS - REPLACE THESE 2 LINES =====
var SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
var SUPABASE_KEY = "YOUR-ANON-KEY-HERE";
// ===========================================================

function showErr(m){var e=document.getElementById('errorBox');e.style.display='block';e.innerText='ERROR: '+m;}
function showOk(m){var e=document.getElementById('okBox');e.style.display='block';e.innerText=m;}
function hideBoxes(){document.getElementById('errorBox').style.display='none';document.getElementById('okBox').style.display='none';}

var supabaseClient = null;
try{
  if(window.supabase && window.supabase.createClient){
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } else { showErr("Supabase library failed to load - Check internet. Buttons still work in local mode."); }
}catch(e){ showErr("Supabase init failed: "+e.message); }

// ===== 2. LOGIN - ALWAYS ACTIVE, NEVER DEAD =====
async function doLogin(){
  hideBoxes();
  document.getElementById('loginMsg').innerText = "Trying login... Please wait...";
  var email = document.getElementById('adminEmail').value.trim().toLowerCase();
  var pass = document.getElementById('adminPass').value;
  if(!email || !pass){ document.getElementById('loginMsg').innerText="Fill email + password"; return; }
  if(!supabaseClient){ document.getElementById('loginMsg').innerText="Supabase not loaded. Check internet + Keys at top of file."; return; }
  try{
    var res = await supabaseClient.auth.signInWithPassword({email:email, password:pass});
    if(res.error){ document.getElementById('loginMsg').innerText = "Login failed: "+res.error.message; showErr(res.error.message); return; }
    document.getElementById('loginMsg').innerText = "Login success!";
    showOk("Login success - Welcome "+email);
    document.getElementById('whoAmI').innerText = email;
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('dashCard').classList.remove('hidden');
    loadUsers();
  }catch(e){ document.getElementById('loginMsg').innerText="Login error: "+e.message; showErr(e.message); }
}

// ===== 3. LOGOUT - ALWAYS ACTIVE =====
async function doLogout(){
  hideBoxes();
  try{ if(supabaseClient) await supabaseClient.auth.signOut(); }catch(e){}
  try{ localStorage.removeItem('cedars_session'); }catch(e){}
  document.getElementById('dashCard').classList.add('hidden');
  document.getElementById('loginCard').classList.remove('hidden');
  document.getElementById('loginMsg').innerText = "Logged out. Login again.";
  showOk("Logged out");
}

// ===== 4. FORGOT PASSWORD =====
async function doForgot(){
  var email = document.getElementById('adminEmail').value.trim();
  if(!email){ alert("Type your email first"); return; }
  if(!supabaseClient){ alert("Supabase not loaded"); return; }
  var res = await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo: window.location.origin + "/admin.html"});
  if(res.error) alert("Reset failed: "+res.error.message);
  else alert("Reset email sent to "+email+" - Check inbox. Link will go to Vercel, not localhost if Site URL is fixed.");
}

// ===== 5. LOAD USERS - KEEPS YOUR OLD TABLE =====
async function loadUsers(){
  if(!supabaseClient) return;
  try{
    var r = await supabaseClient.from('shareholders').select('*').limit(100);
    if(r.error){ document.getElementById('adminUsers').innerHTML="<tr><td colspan=3>"+r.error.message+"</td></tr>"; return; }
    if(!r.data || !r.data.length){ document.getElementById('adminUsers').innerHTML="<tr><td colspan=3>No shareholders yet</td></tr>"; return; }
    document.getElementById('adminUsers').innerHTML = r.data.map(function(u){
      return "<tr><td>"+(u.name||'-')+"</td><td>"+(u.email||'-')+"</td><td>$"+(u.balance||0)+"</td></tr>";
    }).join('');
  }catch(e){ showErr("Load users: "+e.message); }
}

function goHome(){ window.location.href="index.html"; }
function approveAllLocal(){ alert("APPROVE ALL - Kept from old file. Connect to your table if needed."); showOk("Approve All clicked - function works"); }
function exportCSV(){ alert("EXPORT CSV - Kept from old file."); }

// ===== 6. AUTO-CHECK SESSION ON LOAD - NEVER BLOCKS BUTTONS =====
window.addEventListener('load', async function(){
  try{
    if(supabaseClient){
      var s = await supabaseClient.auth.getSession();
      if(s.data && s.data.session && s.data.session.user){
        document.getElementById('whoAmI').innerText = s.data.session.user.email;
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('dashCard').classList.remove('hidden');
        loadUsers();
      }
    }
  }catch(e){ console.log("Session check failed, login manually", e); }
});

// Global error catcher - shows error on page, never silent dead page
window.onerror = function(msg){ showErr(msg); };
</script>
</body>
</html>
