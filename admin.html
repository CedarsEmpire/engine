  document.getElementById('page').innerHTML=html;
}
function renderCredits(){
  var html='<div class="card"><h3>💳 Credits / Spend / Bills</h3><input id="cMem" placeholder="Member ID"><input id="cAmt" type="number" placeholder="Amount"><button class="btn" onclick="addCredit()">+ Give Credit</button><table><tr><th>ID</th><th>Member</th><th>Amount</th><th>Status</th></tr>'+credits.map(function(c){return '<tr><td>'+c.id+'</td><td>'+esc(c.member)+'</td><td>£'+c.amount+'</td><td>'+c.status+'</td></tr>'}).join('')+'</table></div>';
  document.getElementById('page').innerHTML=html;
}
function renderSourcing(){
  var html='<div class="card"><h3>🔎 AI Sourcing - Auto Every 5 Sec</h3><p>Sourced: <b>'+sourcedCount+'</b> | Last: '+(sourceFeed[0]||'None')+'</p><button class="btn" onclick="autoAISourcing()">🔎 Source One Now</button><button class="btn2" onclick="toggleAI()">Toggle AI</button><div class="feed">'+sourceFeed.join('<br>')+'</div></div>';
  document.getElementById('page').innerHTML=html;
}
function renderVerification(){
  var html='<div class="card"><h3>✅ AI Verification - Auto Every 1 Sec</h3><p>Verified: <b>'+verifiedCount+'</b> | Pending: '+vers.filter(function(v){return v.s==='Pending'}).length+'</p><button class="btn" onclick="manualVerify()">Manual Verify Next</button><div id="aiManualMsg"></div><table><tr><th>Task</th><th>Pay</th><th>Status</th><th>Proof</th></tr>'+vers.slice(-25).reverse().map(function(v){return '<tr><td>'+esc(v.id)+' '+esc(v.t)+'</td><td>£'+v.a+'</td><td>'+v.s+'</td><td><small>'+esc(v.proof||'-')+'</small></td></tr>'}).join('')+'</table></div>';
  document.getElementById('page').innerHTML=html;
}
function renderBrain(){
  var html='<div class="card"><h3>🧠 AI BRAIN - Control Center</h3><p>Health: <b class="green">'+aiHealth+'%</b> | Decisions: '+aiDecisions+' | Sourced: '+sourcedCount+' | Verified: '+verifiedCount+'</p><p><b>30-Year Prediction:</b> '+AIBrain.predict()+'</p><p><b>Smart Layer Now:</b> '+AIBrain.pickLayer()+' (based on time of day)</p><div class="grid3"><div class="card"><b>Auto Sourcing</b><p>Every 5 sec, picks smart layer + region, scores task, creates proof.</p><button class="btn" onclick="autoAISourcing()">Source One Now</button></div><div class="card"><b>Auto Verification</b><p>Every 1 sec, verifies pending with worker ID + SHA proof.</p><button class="btn2" onclick="autoAIVerification()">Verify One Now</button></div><div class="card"><b>Auto Rebalance</b><p>Moves 1% from richest grid to poorest grid.</p><button class="btn" onclick="AIBrain.autoBalance();render()">Rebalance Now</button></div></div><div class="card"><b>AI Log</b><div class="feed">'+feedArr.join('<br>')+'</div></div></div>';
  document.getElementById('page').innerHTML=html;
}
function renderLive(){
  var html='<div class="card"><h3>⚡ Live Earnings</h3><input id="leAmt" type="number" placeholder="Amount"><button class="btn" onclick="liveAdd()">+ Add Live Earning</button><div id="leMsg"></div><p><small>Live earning goes 95% General + 5% Global Engine</small></p></div>';
  document.getElementById('page').innerHTML=html;
}
function renderSupport(){
  var html='<div class="card"><h3>💬 Support Center</h3><p>Support Fund: £'+balances[10].balance.toFixed(2)+'</p><input id="supTo" placeholder="To Member ID"><textarea id="supMsg" placeholder="Support message..."></textarea><button class="btn" onclick="sendSupport()">Send Support Reply</button><button class="btn2" onclick="addSupportFund()">+ Add £100 to Support Fund</button><div class="feed">'+feedArr.join('<br>')+'</div></div>';
  document.getElementById('page').innerHTML=html;
}

// ============ ACTIONS - ALL BUTTONS VERIFIED ============
function addBal(i){ var v=+document.getElementById('ba'+i).value||0; if(v<=0) return alert('Invalid amount'); balances[i].balance+=v; logAct('Add Balance',balances[i].name+' +£'+v); dbSave('balances',{name:balances[i].name,balance:balances[i].balance}); alert('Added £'+v); render(); }
function addEngine(i){ var v=+document.getElementById('geAmt').value||0; if(v<=0) return alert('Invalid'); balances[i].balance+=v; logAct('Engine Add',balances[i].name+' +£'+v); render(); }
function withdrawEngine(i){ var v=+document.getElementById('ba'+i).value||0; if(v<=0||v>balances[i].balance) return alert('Invalid / Insufficient'); balances[i].balance-=v; logAct('Engine Withdraw',balances[i].name+' -£'+v); render(); }
function distributeGlobal(){ var amt=balances[1].balance*0.2; if(amt<=0) return alert('Global empty'); balances[1].balance-=amt; for(var i=2;i<=9;i++) balances[i].balance+=amt/8; logAct('Distribute','Global distributed £'+amt.toFixed(2)+' to 8 engines'); render(); }
function sendToGlobal(i){ if(i===1) return; var amt=balances[i].balance*0.1; balances[i].balance-=amt; balances[1].balance+=amt; logAct('Send to Global',balances[i].name+' → Global £'+amt.toFixed(2)); render(); }
function addGrid(id){ var v=+document.getElementById('g'+id).value; if(!v) return alert('Enter amount'); var g=grids.find(function(x){return x.id===id}); g.balance+=v; g.tasks++; balances[9].balance+=v; balances[0].balance+=v*0.1; logAct('Grid Add','Grid #'+id+' '+g.name+' +£'+v); dbSave('grids',{grid_id:id,name:g.name,balance:g.balance}); render(); }
function gridToEngine(id){ var g=grids.find(function(x){return x.id===id}); var amt=g.balance*0.1; if(amt<=0) return alert('Grid empty'); g.balance-=amt; var map={'America North':2,'America South':3,'Africa':4,'Asia':5,'Europe':6,'Oceania':7,'Middle East':8}; var ei=map[g.region]||1; balances[ei].balance+=amt; balances[1].balance+=amt*0.1; logAct('Grid→Engine',g.name+' → '+balances[ei].name+' £'+amt.toFixed(2)); render(); }
function gridToGlobal(id){ var g=grids.find(function(x){return x.id===id}); var amt=g.balance*0.05; if(amt<=0) return alert('Grid empty'); g.balance-=amt; balances[1].balance+=amt; logAct('Grid→Global',g.name+' → Global £'+amt.toFixed(2)); render(); }
function toggleAI(){ autoAI_ON=!autoAI_ON; logAct('AI Toggle', autoAI_ON?'ON':'OFF'); render(); }
function manualVerify(){ var p=vers.find(function(v){return v.s==='Pending'}); if(!p){ alert('No Pending - AI Will Source In 5 Sec'); return; } var worker='MANUAL-'+String(1+Math.floor(Math.random()*100)).padStart(3,'0'); p.proof=AIBrain.generateProof(p.id,worker); p.s='Approved'; balances[0].balance+=p.a; balances[1].balance+=p.a*0.1; profitToday+=p.a*0.1; verifiedCount++; var el=document.getElementById('aiManualMsg'); if(el) el.innerHTML='✅ Verified '+p.id+' - £'+p.a+'<br><small>'+p.proof+'</small>'; logAct('Manual Verify',p.id); dbSave('tasks',{task_id:p.id,status:'Approved',proof:p.proof}); render(); }
function autoAISourcing(){ try{ if(!autoAI_ON) return; var layer=AIBrain.pickLayer(); var region=AIBrain.pickRegion(); var title=autoSources[Math.floor(Math.random()*autoSources.length)]; var pay=AIBrain.decidePay(layer); var score=AIBrain.scoreTask(layer,region); var taskId='TASK-AUTO-'+String(autoTaskNum++).padStart(3,'0'); sourcedCount++; var task={id:taskId,r:region,t:title+' ['+layer+' - Score '+score+'%]',c:layer,a:pay,s:'Pending',proof:''}; vers.push(task); addToSourceFeed('🔎 SOURCED '+taskId+' - '+title+' ['+layer+' - '+region+'] £'+pay+' Score '+score+'%'); addToFeed('🔎 SOURCED '+taskId+' - Waiting For Verification...'); logAct('AI Sourcing',taskId); dbSave('tasks',{task_id:taskId,region:region,layer:layer,amount:pay,status:'Pending'}); updTop(); if(['Dashboard','AI Sourcing','AI Verification','Approvals','AI Brain'].indexOf(cur)>-1) render(); }catch(e){} }
function autoAIVerification(){ try{ if(!autoAI_ON) return; var p=vers.find(function(v){return v.s==='Pending'}); if(!p) return; var worker='AI-'+String(1+Math.floor(Math.random()*2600)).padStart(4,'0'); var proof=AIBrain.generateProof(p.id,worker); p.proof=proof; p.s='Approved'; verifiedCount++; aiDecisions++; balances[0].balance+=p.a; balances[1].balance+=p.a*0.1; profitToday+=p.a*0.1; proofs.push({task:p.id,proof:proof,worker:worker}); addToFeed('✅ VERIFIED '+p.id+' by '+worker+' - £'+p.a+' - '+proof); logAct('AI Verify',p.id); updTop(); if(['Dashboard','AI Verification','Approvals','AI Brain'].indexOf(cur)>-1) render(); }catch(e){} }
function approveAll(){ var c=0; withdrawQueue.forEach(function(w){ if(w.status==='Pending'){ w.status='Approved'; balances[0].balance-=w.amount; c++; } }); members.forEach(function(m){ if(m.kyc==='Pending'){ m.kyc='Approved'; c++; } }); deposits.forEach(function(d){ if(d.status==='Pending'){ d.status='Approved'; balances[0].balance+=d.amount; c++; } }); var pv=vers.find(function(v){return v.s==='Pending'}); if(pv){ pv.s='Approved'; verifiedCount++; c++; } logAct('Approve All', c+' items approved'); alert('Approved '+c+' items'); render(); }
function approveW(i){ if(withdrawQueue[i].status!=='Pending') return; withdrawQueue[i].status='Approved'; balances[0].balance-=withdrawQueue[i].amount; logAct('Approve Withdraw',withdrawQueue[i].id); dbSave('withdrawals',{withdraw_id:withdrawQueue[i].id,status:'Approved'}); render(); }
function rejectW(i){ withdrawQueue[i].status='Rejected'; logAct('Reject Withdraw',withdrawQueue[i].id); render(); }
function approveKYC(i){ members[i].kyc='Approved'; logAct('Approve KYC',members[i].name); dbSave('members',{name:members[i].name,kyc:'Approved'}); render(); }
function rejectKYC(i){ members[i].kyc='Rejected'; logAct('Reject KYC',members[i].name); render(); }
function removeMember(i){ if(!confirm('Remove '+members[i].name+'?')) return; members.splice(i,1); render(); }
function addMember(){ var n=document.getElementById('mName').value.trim(); var r=document.getElementById('mRegion').value; var b=+document.getElementById('mBal').value||0; if(!n) return alert('Name required'); var nm={id:'M-'+String(members.length+1).padStart(3,'0'),name:n,kyc:'Pending',bal:b,region:r}; members.push(nm); logAct('New Member',n); dbSave('members',{name:n,kyc:'Pending',bal:b,region:r}); render(); }
function addWithdraw(){ var m=document.getElementById('wMem').value.trim(); var a=+document.getElementById('wAmt').value; if(!m||!a) return alert('Fill all'); var w={id:'W-'+String(withdrawQueue.length+1).padStart(3,'0'),member:m,amount:a,status:'Pending'}; withdrawQueue.push(w); logAct('Withdraw Request',m+' £'+a); dbSave('withdrawals',{member:m,amount:a,status:'Pending'}); render(); }
function addDeposit(){ var m=document.getElementById('dMem').value.trim(); var a=+document.getElementById('dAmt').value; if(!m||!a) return alert('Fill all'); var d={id:'D-'+String(deposits.length+1).padStart(3,'0'),member:m,amount:a,status:'Pending'}; deposits.push(d); logAct('Deposit Request',m+' £'+a); render(); }
function approveDeposit(i){ if(deposits[i].status!=='Pending') return; deposits[i].status='Approved'; balances[0].balance+=deposits[i].amount; logAct('Approve Deposit',deposits[i].id); render(); }
function addCredit(){ var m=document.getElementById('cMem').value.trim(); var a=+document.getElementById('cAmt').value; if(!m||!a) return alert('Fill all'); credits.push({id:'C-'+String(credits.length+1).padStart(3,'0'),member:m,amount:a,status:'Approved'}); balances[0].balance-=a; logAct('Credit Given',m+' £'+a); render(); }
function liveAdd(){ var a=+document.getElementById('leAmt').value; if(!a) return alert('Enter amount'); balances[0].balance+=a*0.95; balances[1].balance+=a*0.05; profitToday+=a*0.05; document.getElementById('leMsg').innerHTML='✅ Live Earning +£'+a; logAct('Live Earning','£'+a); render(); }
function sendSupport(){ var t=document.getElementById('supMsg').value.trim(); var to=document.getElementById('supTo').value.trim(); if(!t) return alert('Write message'); logAct('Support Reply','To '+(to||'Member')+': '+t); alert('Support sent to '+(to||'Member')); render(); }
function addSupportFund(){ balances[10].balance+=100; balances[0].balance-=100; logAct('Support Fund','+£100'); render(); }

// ============ START ============
render();
dbLoad();
setInterval(autoAISourcing, 5000); autoAISourcing();
setInterval(autoAIVerification, 1000);
setInterval(function(){ AIBrain.autoBalance(); updTop(); }, 60000);
</script>
