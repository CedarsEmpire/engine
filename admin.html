async function loadLive(){let b=document.getElementById('liveBox');if(b)b.innerHTML='Loading...';let o='';try{let r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether,tron&vs_currencies=usd,gbp');let d=await r.json();o+=`BTC $${d.bitcoin.usd} / £${d.bitcoin.gbp} | ETH $${d.ethereum.usd} | USDT $${d.tether.usd} | TRX $${d.tron.usd}<br>`}catch(e){o+='Crypto offline<br>'}try{let rf=await fetch('https://api.exchangerate.host/latest?base=GBP&symbols=USD,EUR,UGX');let df=await rf.json();if(df.rates)o+=`£1 = $${df.rates.USD?.toFixed(4)} | €${df.rates.EUR?.toFixed(4)} | UGX ${df.rates.UGX?.toFixed(0)}<br>`}catch(e){}if(b)b.innerHTML=o+new Date().toLocaleTimeString();let e2=document.getElementById('liveBox2');if(e2)e2.innerHTML=o}
function sDot(s){if(s==='Approved')return'<span class="dot dot-on"></span>🟢 SUCCESS';if(s==='Settled')return'<span class="dot dot-set"></span>🟣 SETTLED';if(s==='Pending')return'<span class="dot dot-pen"></span>🟡 PENDING';return s}
function verRow(v){return `<div style="display:flex;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid #333"><span><b>${v.id}</b> - ${v.t} - £${v.a} - ${sDot(v.s)}</span><div style="display:flex;gap:6px"><button style="background:#00e676;border:0;padding:8px 12px;border-radius:20px;font-weight:bold" onclick="approveVer('${v.id}')">🟢 Approve</button><button style="background:#ff1744;color:#fff;border:0;padding:8px 12px;border-radius:20px" onclick="rejectVer('${v.id}')">Reject</button></div></div>`}
function approveVer(id){let r=prompt('Reason:');if(!r)return alert('Reason Required');let p=prompt('Evidence:');if(!p)return alert('Evidence Required');let pin=prompt('PIN:');if(pin!=='1234')return alert('Wrong PIN');let v=vers.find(x=>x.id===id);v.s='Approved';v.evidence=p;balances[0].balance+=v.a;updTop();push('🟢 APPROVED '+id);logAct('Approve',id);alert('🟢 Approved '+id);render()}
function rejectVer(id){let r=prompt('Reason:');if(!r)return alert('Reason Required');let pin=prompt('PIN:');if(pin!=='1234')return alert('Wrong PIN');let v=vers.find(x=>x.id===id);v.s='Rejected';logAct('Reject',id);alert('Rejected '+id);render()}
async function loadW(){try{let {data,error}=await supa.from('ledger').select('*,users(username)').eq('type','WITHDRAW').eq('status','PENDING').order('created_at',{ascending:false}).limit(50);if(error)throw error;return data||[]}catch(e){return[]}}
async function loadD(){try{let {data,error}=await supa.from('ledger').select('*,users(username)').eq('type','DEPOSIT_SUPPORT').eq('status','PENDING').order('created_at',{ascending:false}).limit(50);if(error)throw error;return data||[]}catch(e){return[]}}
async function approveW(id,amt,fee){let pin=prompt('PIN:');if(pin!=='1234')return alert('Wrong PIN');let reason=prompt('Reason:');if(!reason)return alert('Reason Required');let proof=prompt('Proof:');if(!proof)return alert('Proof Required');balances[2].balance+=Number(fee||0);updTop();let {error}=await supa.from('ledger').update({status:'APPROVED',meta:{admin_reason:reason,proof}}).eq('id',id);if(error)return alert(error.message);push('🟢 Withdraw £'+amt);await logAct('APPROVE Withdraw',id);alert('🟢 APPROVED £'+amt);render()}
async function rejectW(id){let pin=prompt('PIN:');if(pin!=='1234')return alert('Wrong PIN');let reason=prompt('Reason:');if(!reason)return alert('Reason Required');await supa.from('ledger').update({status:'REJECTED',meta:{admin_reason:reason}}).eq('id',id);await logAct('REJECT Withdraw',id);alert('❌ REJECTED');render()}
async function completeD(id,amt,meta){let pin=prompt('PIN:');if(pin!=='1234')return alert('Wrong PIN');let reason=prompt('Reason:');if(!reason)return alert('Reason Required');balances[0].balance+=Number(amt||0);balances[7].balance+=Number(amt||0);updTop();let {error}=await supa.from('ledger').update({status:'APPROVED',meta:{...(meta||{}),admin_reason:reason}}).eq('id',id);if(error)return alert(error.message);push('🟢 Deposit £'+amt);await logAct('COMPLETE Deposit',id);alert('🟢 COMPLETED £'+amt);render()}
async function rejectD(id,amt,meta){let pin=prompt('PIN:');if(pin!=='1234')return alert('Wrong PIN');let reason=prompt('Reason:');if(!reason)return alert('Reason Required');await supa.from('ledger').update({status:'REJECTED',meta:{...(meta||{}),admin_reason:reason}}).eq('id',id);await logAct('REJECT Deposit',id);alert('❌ REJECTED');render()}
