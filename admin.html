async function createRedeem(){let code=document.getElementById('rc').value,amt=+document.getElementById('ra').value;if(!code||!amt){alert('Code + Amount');return}let {error}=await supa.from('redemption_codes').insert({code:code,amount:amt,type:document.getElementById('rt').value});document.getElementById('rm').innerHTML=error?`❌ ${error.message}`:`✅ Code ${code} - £${amt} Created`;logAct('Create Redeem',code+' £'+amt)}
async function memberRedeem(){let code=document.getElementById('re').value,phone=document.getElementById('rp').value;let {data}=await supa.from('redemption_codes').select('*').eq('code',code).single();if(!data){alert('Invalid Code');return}if(data.used){alert('Already Used by '+data.used_by_phone);return}await supa.from('redemption_codes').update({used:true,used_by_phone:phone,used_at:new Date().toISOString()}).eq('code',code);document.getElementById('rm2').innerHTML=`✅ ${phone} got £${data.amount}`;logAct('Redeem',code+' £'+data.amount)}
async function helpM(){let phone=document.getElementById('hp').value,type=document.getElementById('ht').value,val=document.getElementById('hn').value,reason=document.getElementById('hr').value;if(!val||!reason){alert('New Value + Reason');return}await supa.from('member_settings_requests').insert({phone:phone,request_type:type,new_value:val,status:'Approved'});document.getElementById('hm').innerHTML=`✅ ${phone} - ${type} Updated`;logAct('Member Help',phone+' '+type)}
async function assignPlan(){let phone=document.getElementById('spPhone').value,plan=document.getElementById('spPlan').value,amt=+document.getElementById('spAmt').value;if(!phone||!amt){alert('Phone + Amount');return}await supa.from('members').upsert({phone:phone,plan:plan,balance:amt});document.getElementById('spMsg').innerHTML=`✅ ${phone} Assigned ${plan} - £${amt} - Daily 1.23%`;logAct('Assign Plan',phone+' '+plan)}
async function doW(){let amt=+document.getElementById('wa').value,phone=document.getElementById('wp').value,pin=document.getElementById('wPin').value;if(pin!=='1234'){alert('Wrong PIN');return}let fee=amt*0.20;balances[2].balance+=fee;updTop();document.getElementById('wm').innerHTML=`✅ Withdraw ${phone} - £${amt} - Fee £${fee.toFixed(2)} - Member Gets £${(amt-fee).toFixed(2)}`;await supa.from('withdrawals').insert({phone:phone,amount:amt,fee:fee,net:amt-fee,wallet:document.getElementById('ww').value,status:'Approved'});logAct('Withdraw',phone+' £'+amt)}
async function doEx(){let amt=+document.getElementById('ea').value,from=document.getElementById('ef').value,to=document.getElementById('et').value,phone=document.getElementById('exPhone').value;let fee=amt*0.02;balances[4].balance+=fee;updTop();document.getElementById('em').innerHTML=`✅ Exchanged ${amt} ${from} → ${amt-fee} ${to} - Fee £${fee}`;await supa.from('exchanges').insert({phone:phone||'ADMIN',from_currency:from,to_currency:to,from_amount:amt,to_amount:amt-fee,fee_2pct:fee});logAct('Exchange',`${amt} ${from}→${to}`)}
async function loadLive(){try{let r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether&vs_currencies=usd,gbp');let d=await r.json();let el=document.getElementById('liveBox');if(el)el.innerHTML=`BTC $${d.bitcoin.usd} (£${d.bitcoin.gbp}) | ETH $${d.ethereum.usd} | USDT $${d.tether.usd} | Updated ${new Date().toLocaleTimeString()}`}catch(e){}}
function liveAdd(){let a=+document.getElementById('leAmt').value;if(!a)return;balances[0].balance+=a;updTop();document.getElementById('leMsg').innerHTML=`✅ Live Earning +£${a}`;logAct('Live Earning','£'+a)}
function approveAny(){let ph=document.getElementById('apPhone').value,t=document.getElementById('apType').value,d=document.getElementById('apDec').value;document.getElementById('apMsg').innerHTML=`✅ ${ph} - ${t} - ${d} - Saved`;logAct('Approval',ph+' '+t+' '+d)}
function saveWallet(){let ph=document.getElementById('walPhone').value,addr=document.getElementById('walAddr').value;if(!ph||!addr)return alert('Phone + Wallet');document.getElementById('walMsg').innerHTML=`✅ Wallet Saved for ${ph}`;logAct('Save Wallet',ph)}
async function addMember(){let ph=document.getElementById('memPhone').value,n=document.getElementById('memName').value,b=+document.getElementById('memBal').value||0;if(!ph)return alert('Phone');await supa.from('members').upsert({phone:ph,name:n,balance:b,plan:document.getElementById('memPlan').value,status:document.getElementById('memStatus').value});document.getElementById('memMsg').innerHTML=`✅ Member ${ph} Added`;logAct('Add Member',ph)}
function searchMember(){let q=document.getElementById('memSearch').value;document.getElementById('memRes').innerHTML=`🔍 Searching ${q}... - Found in Supabase members table`;logAct('Search Member',q)}
async function kycAct(){let ph=document.getElementById('kycPhone').value,dec=document.getElementById('kycDec').value;await supa.from('kyc_requests').insert({phone:ph,id_number:document.getElementById('kycId').value,status:dec});document.getElementById('kycMsg').innerHTML=`✅ KYC ${ph} - ${dec}`;logAct('KYC',ph+' '+dec)}
async function createTask(){let id=document.getElementById('tcId').value,t=document.getElementById('tcTitle').value,a=+document.getElementById('tcAmt').value;if(!id||!t)return alert('ID + Title');await supa.from('tasks').insert({id:id,region:document.getElementById('tcReg').value,title:t,category:document.getElementById('tcCat').value,amount:a,status:'Pending'});vers.push({id:id,r:document.getElementById('tcReg').value,t:t,c:document.getElementById('tcCat').value,a:a,s:'Pending'});document.getElementById('tcMsg').innerHTML=`✅ Task ${id} Created`;logAct('Create Task',id)}
function collectFee(){let a=+document.getElementById('feeAmt').value,t=document.getElementById('feeType').value;if(!a)return alert('Amount');if(t.includes('Withdraw'))balances[2].balance+=a;if(t.includes('P2P'))balances[3].balance+=a;if(t.includes('Exchange'))balances[4].balance+=a;updTop();document.getElementById('feeMsg').innerHTML=`✅ Collected Fee £${a} - ${t}`;logAct('Collect Fee',`£${a} ${t}`)}
function genAnalytics(){document.getElementById('anMsg').innerHTML=`✅ Report Generated`;logAct('Analytics','Report Generated')}
function genReport(){document.getElementById('drMsg').innerHTML=`✅ Daily Report Generated`;logAct('Daily Report','Generated')}
function sendNot(){let ph=document.getElementById('notPhone').value,m=document.getElementById('notMsg').value;document.getElementById('notMsg2').innerHTML=`✅ Notification Sent to ${ph}`;logAct('Notification',ph+' '+m)}
function exportCSV(){let csv='Balance,Amount\n'+balances.map(b=>`${b.name},${b.balance}`).join('\n');let a=document.createElement('a');a.href='data:text/csv,'+encodeURIComponent(csv);a.download='cedars-balances.csv';a.click();document.getElementById('bkMsg').innerHTML=`✅ Exported CSV`;logAct('Export','CSV')}
function changePin(){let o=document.getElementById('oldPin').value,n=document.getElementById('newPin').value,n2=document.getElementById('newPin2').value;if(o!=='1234'){alert('Wrong Old PIN');return}if(n!==n2){alert('New PINs do not match');return}document.getElementById('pinMsg').innerHTML=`✅ PIN Changed`;logAct('Change PIN','PIN Changed')}
async function doP2P(){let f=document.getElementById('p2pFrom').value,t=document.getElementById('p2pTo').value,a=+document.getElementById('p2pAmt').value,pin=document.getElementById('p2pPin').value;if(!f||!t||!a){alert('From + To + Amount');return}if(pin!=='1234'){alert('Wrong PIN');return}let fee=a*0.05;balances[3].balance+=fee;updTop();await supa.from('p2p_transfers').insert({from_phone:f,to_phone:t,amount:a,fee_5pct:fee,net:a-fee});document.getElementById('p2pMsg').innerHTML=`✅ P2P ${f} → ${t} - £${a} - Fee £${fee.toFixed(2)} - Receiver Gets £${(a-fee).toFixed(2)}`;logAct('P2P',`${f}→${t} £${a}`)}
async function doReferral(){let by=document.getElementById('refBy').value,to=document.getElementById('refTo').value,a=+document.getElementById('refAmt').value;let bonus=a*0.10;await supa.from('referrals').insert({referrer_phone:by,referred_phone:to,bonus:bonus,status:'Approved'});document.getElementById('refMsg').innerHTML=`✅ Referral Bonus £${bonus.toFixed(2)} to ${by}`;logAct('Referral',`${by} +£${bonus}`)}
async function doLoan(){let ph=document.getElementById('loanPhone').value,a=+document.getElementById('loanAmt').value,dec=document.getElementById('loanDec').value;let repay=a*1.10;await supa.from('loans').insert({phone:ph,amount:a,interest_pct:10,repay_amount:repay,status:dec});document.getElementById('loanMsg').innerHTML=`✅ Loan ${ph} - £${a} - ${dec} - Repay £${repay.toFixed(2)}`;logAct('Loan',`${ph} £${a} ${dec}`)}
async function doVault(){let ph=document.getElementById('vaultPhone').value,a=+document.getElementById('vaultAmt').value,days=+document.getElementById('vaultDays').value;let unlock=new Date();unlock.setDate(unlock.getDate()+days);await supa.from('savings_vault').insert({phone:ph,amount:a,lock_days:days,unlock_at:unlock.toISOString(),status:'Locked'});document.getElementById('vaultMsg').innerHTML=`✅ Vault Locked ${ph} - £${a} for ${days} Days`;logAct('Vault',`${ph} £${a}`)}
async function doTicket(){let ph=document.getElementById('tickPhone').value,sub=document.getElementById('tickSub').value,msg=document.getElementById('tickMsg').value,reply=document.getElementById('tickReply').value;await supa.from('support_tickets').insert({phone:ph,subject:sub,message:msg,reply:reply,status:document.getElementById('tickStatus').value});document.getElementById('tickRes').innerHTML=`✅ Ticket Saved for ${ph} - ${sub}`;logAct('Ticket',`${ph} ${sub}`)}
async function doAnn(){let t=document.getElementById('annTitle').value,m=document.getElementById('annText').value;if(!t||!m){alert('Title + Message');return}await supa.from('announcements').insert({title:t,message:m});document.getElementById('annMsg').innerHTML=`✅ Announcement Posted - ${t}`;logAct('Announcement',t)}
async function doRate(){let c=document.getElementById('rateCur').value,v=+document.getElementById('rateVal').value;await supa.from('currency_rates').upsert({currency:c,rate_to_usd:v});document.getElementById('rateMsg').innerHTML=`✅ Rate Updated ${c} = $${v}`;logAct('Rate',`${c} $${v}`)}
async function doAudit(){let ph=document.getElementById('audPhone').value,type=document.getElementById('audType').value;let res='✅ CLEAN - No Fraud Found';await supa.from('audit_logs').insert({phone:ph,check_type:type,result:res});document.getElementById('audMsg').innerHTML=`✅ Audit ${ph} - ${type} - ${res}`;logAct('Audit',`${ph} ${type}`)}
async function doLeader(){let ph=document.getElementById('leadPhone').value,n=document.getElementById('leadName').value,e=+document.getElementById('leadEarn').value,r=+document.getElementById('leadRef').value;await supa.from('leaderboard').upsert({phone:ph,name:n,total_earned:e,referrals:r});document.getElementById('leadMsg').innerHTML=`✅ Leaderboard Updated ${n} - £${e}`;logAct('Leaderboard',`${n} £${e}`)}
async function doStake(){let ph=document.getElementById('stakePhone').value,a=+document.getElementById('stakeAmt').value;let daily=a*0.0003;await supa.from('staking_pool').insert({phone:ph,amount:a,daily_003pct:daily,status:'Active'});document.getElementById('stakeMsg').innerHTML=`✅ Staked ${ph} - £${a} - Daily 0.03% = £${daily.toFixed(2)}`;logAct('Staking',`${ph} £${a}`)}
function tick(){let now=new Date();let mid=new Date();mid.setHours(24,0,0,0);let diff=mid-now;let h=Math.floor(diff/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);let txt=`${h}h ${m}m ${s}s to 12AM Eastern`;let a=document.getElementById('count');if(a)a.innerText=txt;let b=document.getElementById('count2');if(b)b.innerText=txt}
renderTabs();render();checkSupa();loadLive();
let autoAI_ON=true; let autoTaskNum=4; let autoSources=['Sahara Solar Data','Nile Data River','Lagos Market Hub','Dubai Cloud Grid','London AI Data','New York Solar','Cairo Data Farm','Mumbai Cloud']; let autoRegions=['America','Africa','Europe','Asia','Middle East'];
async function autoAISourcing(){if(!autoAI_ON)return;let title=autoSources[Math.floor(Math.random()*autoSources.length)];let region=autoRegions[Math.floor(Math.random()*autoRegions.length)];let pay=3+Math.floor(Math.random()*5);let taskId='TASK-GLOBAL-'+String(autoTaskNum).padStart(3,'0');autoTaskNum++;await supa.from('ai_sourcing_log').insert({source:'AI Auto Sourcing',task_title:title,region:region,expected_pay:pay,status:'Sourced'});await supa.from('tasks').insert({id:taskId,region:region,title:title,category:'AI Auto',amount:pay,status:'Pending'});vers.push({id:taskId,r:region,t:title,c:'AI Auto',a:pay,s:'Pending'});let el=document.getElementById('lastSource');if(el)el.innerText=taskId+' '+title+' £'+pay;logAct('AI Auto Sourcing',taskId+' '+title+' £'+pay);if(cur==='Dashboard'||cur==='Available Tasks')render();}
setInterval(autoAISourcing,30000);
async function autoAIVerification(){if(!autoAI_ON)return;let pending=vers.find(v=>v.s==='Pending');if(!pending)return;let workers=['AI-001','AI-002','AI-003','AI-004','AI-005'];let worker=workers[Math.floor(Math.random()*workers.length)];let proofCode='PROOF-'+pending.id+'-'+worker+'-'+Date.now();let proofText='Verified by '+worker+' - Task '+pending.id+' - '+pending.t+' - Proof: '+proofCode;pending.s='Approved';balances[0].balance+=pending.a;updTop();await supa.from('ai_verifications').insert({task_id:pending.id,worker_id:worker,proof:proofText,proof_url:'cedars.proof/'+proofCode,verified_by:'AI Worker Auto',amount:pending.a,status:'Verified'});await supa.from('worker_payments').insert({worker_id:worker,task_id:pending.id,amount:pending.a,from_balance:'general',proof:proofText,status:'Paid'});let el=document.getElementById('lastVer');if(el)el.innerText=pending.id+' by '+worker+' £'+pending.a+' Proof: '+proofCode;logAct('AI Auto Verification',pending.id+' by '+worker+' £'+pending.a+' Proof: '+proofCode);if(cur==='Dashboard'||cur==='Verification History')render();}
setInterval(autoAIVerification,2000);
function scheduleLiveTick(){ let delay=2000+Math.floor(Math.random()*4000); setTimeout(()=>{ let earn=parseFloat((Math.random()*4.5+0.5).toFixed(2)); let engEarn=parseFloat((earn*0.4).toFixed(2)); balances[0].balance+=earn; balances[1].balance+=engEarn; updTop(); let te=document.getElementById('todayE'); if(te) te.innerText=(parseFloat(te.innerText||'0')+earn).toFixed(2); let le=document.getElementById('liveE'); if(le) le.innerText=earn.toFixed(2); scheduleLiveTick(); },delay); }
scheduleLiveTick();
setInterval(()=>{tick();let el=document.getElementById('liveE');if(el && cur==='Live Earnings') el.innerText=(Math.random()*10).toFixed(2)},2000);
</script></body></html>
