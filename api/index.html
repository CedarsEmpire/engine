<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Engine Five</title>
</head>
<body>
  <h1>Engine Five</h1>
  <div>
    <h2>Regions</h2>
    <button onclick="toggleRegion(1)">Region 1: <span id="r1">Off</span></button>
    <button onclick="toggleRegion(2)">Region 2: <span id="r2">Off</span></button>
    <button onclick="toggleRegion(3)">Region 3: <span id="r3">Off</span></button>
    <button onclick="toggleRegion(4)">Region 4: <span id="r4">Off</span></button>
    <button onclick="toggleRegion(5)">Region 5: <span id="r5">Off</span></button>
  </div>
  <div>
    <h2>AI Target</h2>
    <p>€2500 / 24h</p>
  </div>
  <div>
    <h2>Human Reward</h2>
    <p>€15 per task</p>
  </div>
  <div>
    <h2>Payouts</h2>
    <p>Crypto only</p>
  </div>

  <script>
    async function toggleRegion(r) {
      const res = await fetch(`/api/toggle-region/${r}`);
      const data = await res.json();
      document.getElementById(`r${r}`).textContent = data.enabled ? 'On' : 'Off';
    }
  </script>
</body>
</html>
