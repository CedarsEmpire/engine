<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEDARS EMPIRE - Live</title>
    <style>
        /* Your styles here */
    </style>
</head>
<body>
    <!-- Your HTML content here -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'YOUR_SUPABASE_URL';
        const supabaseKey = 'YOUR_SUPABASE_KEY';
        const supabase = Supabase.createClient(supabaseUrl, supabaseKey);

        let earned = 0;
        let totalTasks = 0;
        let depositOn = true;
        let engines = [
            {id:1, name:"Africa", on:true, tasks:32},
            {id:2, name:"Asia", on:true, tasks:28},
            {id:3, name:"America", on:false, tasks:0},
            {id:4, name:"Europe", on:true, tasks:19},
            {id:5, name:"Oceania", on:false, tasks:0},
        ];
        let workerNames = ["Vision Worker","Transcription Worker","Rating Worker","Data Worker","Text Worker"];

        async function getBalance() {
            const { data, error } = await supabase
                .from('balances')
                .select('amount')
                .eq('id', 1);

            if (error) {
                console.error(error);
            } else if (data.length > 0) {
                earned = data[0].amount;
                updateDisplay();
            } else {
                const { data, error } = await supabase
                    .from('balances')
                    .insert([{ id: 1, amount: 0 }]);

                if (error) {
                    console.error(error);
                }
            }
        }

        async function updateBalance(amount) {
            const { data, error } = await supabase
                .from('balances')
                .update({ amount: amount })
                .eq('id', 1);

            if (error) {
                console.error(error);
            }
        }

        function saveBalance(){
            updateBalance(earned);
        }

        function updateDisplay(){
            document.getElementById('earned').innerText = "€"+earned.toFixed(2);
            document.getElementById('withdrawBal').innerText = "€"+earned.toFixed(2);
            let pct = Math.min(100,(earned/2500*100));
            document.getElementById('pct').innerText = pct.toFixed(1)+"%";
            document.getElementById('barFill').style.width = pct+"%";
        }

        function toggleDeposit(){
            depositOn = !depositOn;
            document.getElementById('depositState').innerText = depositOn ? "ON" : "OFF";
            document.getElementById('depositBtn').style.background = depositOn ? "#0a9d6e" : "#999";
        }

        function toggleEngine(id){
            let e = engines.find(x=>x.id===id); e.on = !e.on; renderEngines();
        }

        function renderEngines(){
            document.getElementById('engines').innerHTML = engines.map(e=>`
            <div class="eng"><div style="display:flex;justify-content:space-between">Sub-Engine ${e.id} <button class="${e.on?'on':'off'}" onclick="toggleEngine(${e.id})">${e.on?'ON':'OFF'}</button></div>
            <b style="font-size:18px">${e.name} Engine</b><br><small>20 AI Workers</small><br>
            <small>${e.on?'Workers Active':'Workers Paused'}</small></div>`).join('');
            let active = engines.filter(e=>e.on).length;
            document.getElementById('masterStatus').innerText = active>0 ? "RUNNING" : "PAUSED";
            document.getElementById('workerCount').innerText = active*20;
        }

        function runCycle(){
            let activeEngines = engines.filter(e=>e.on);
            if(activeEngines.length===0) return;
            let e = activeEngines[Math.floor(Math.random()*activeEngines.length)];
            let w = workerNames[Math.floor(Math.random()*workerNames.length)];
            let reward = (Math.random()*0.5+0.3);
            earned += reward;
            totalTasks++;
            e.tasks++;
            saveBalance();
            updateDisplay();
            document.getElementById('workersLive').innerHTML = `<div><span class="dot"></span> Worker #${String(totalTasks).padStart(3,'0')} - ${w} - ${e.name} - Working</div><div style="margin-top:8px;color:#0a9d6e">✅ Last: ${w} in ${e.name} completed +€${reward.toFixed(2)}</div>`;
            document.getElementById('taskTable').innerHTML = engines.map(en=>`<tr><td>${en.name}</td><td>${en.tasks} tasks</td><td><span class="pill">${en.on?'Active':'Idle'}</span></td><td>Just now</td></tr>`).join('');
        }

        getBalance();
        renderEngines();
        updateDisplay();
        runCycle();
        setInterval(runCycle, 3000);
    </script>
</body>
</html>
