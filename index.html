<body>
  <div class="top">
    <h1>CEDARS EMPIRE <span class="live">● Live</span></h1>
    <div id="userEmail">👤 Guest</div>

  <div id="authSection" class="authBox">
    <h2 style="text-align:center;margin:0;font-size:24px">Login / Register</h2>
    <p style="text-align:center;color:#666;font-size:16px;margin-bottom:20px">Access your account to manage your tasks</p>
    <div style="margin-bottom:15px">
      <label style="display:block;margin-bottom:8px;font-weight:500">Email</label>
      <input id="email" type="email" placeholder="Enter your email" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px">

    <div style="margin-bottom:20px">

    </div>
    <div id="rememberMeContainer" style="margin-bottom:20px">
      <label style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="rememberMe" />
        <span>Remember me</span>
      </label>
    </div>
    <div id="authMsg" style="color:#c00;font-size:14px;min-height:18px;text-align:center;margin-bottom:15px"></div>
    <button id="loginBtn" onclick="doLogin()" style="width:100%;padding:14px;border:none;border-radius:8px;background:#0a9d6e;color:#fff;font-weight:bold;font-size:16px;cursor:pointer"> Login </button>
    <button id="registerBtn" onclick="doRegister()" style="width:100%;padding:14px;border:none;border-radius:8px;background:#0f1e2e;color:#fff;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px"> Create Account </button>
  </div>
  <div id="dashSection" style="display:none">
    <div class="actions">
      <button onclick="alert('Logged in as '+currentUser.email)">👤 Profile</button>
      <button class="green" id="depositBtn" onclick="toggleDeposit()">🏦 Deposit <span id="depositState">ON</span></button>
      <button onclick="document.getElementById('taskSection').scrollIntoView()">☰ Task</button>
      <button onclick="document.getElementById('withdrawSection').style.display='block';document.getElementById('withdrawSection').scrollIntoView()">↗️ Withdraw</button>
      <button onclick="alert('Your Referral: https://cedarsempire.com/register?ref='+currentUser.id.slice(0,8))">👥 Referral</button>
      <button onclick="doLogout()" style="background:#ffe5e5">Logout</button>
    </div>
    <div class="grid">
      <div class="card" id="taskSection">
        <h3>Task Activity</h3>
        <table>
          <thead>
            <tr>
              <th>Region</th>
              <th>Tasks</th>
              <th>Status</th>
              <th>Last</th>
            </tr>
          </thead>
          <tbody id="taskTable"></tbody>
        </table>
      </div>
      <div class="card" id="withdrawSection" style="display:none;margin-top:14px">
        <h3>Withdraw</h3>
        <label for="amount">Amount:</label>
        <input type="number" id="amount" placeholder="Enter amount">
        <label for="currency">Currency:</label>
        <select id="currency">
          <option value="EUR">EUR</option>
        </select>
        <button class="green" id="withdrawBtn" onclick="requestWithdrawal()">Withdraw</button>
        <div id="withdrawStatus" style="color:#c00;font-size:14px;min-height:18px;text-align:center"></div>
        <div id="withdrawList" style="font-size:13px;color:#444;margin-top:10px"></div>
      </div>
      <div class="card" id="notificationSection">
        <h3>Notifications</h3>
        <ul id="notificationList"></ul>
      </div>
      <div class="card" id="searchSection">
        <h3>Search</h3>
        <input type="search" id="searchInput" placeholder="Search...">
        <button onclick="search()">Search</button>
        <div id="searchResults"></div>
      </div>
      <div class="card" id="analyticsSection">
        <h3>Analytics</h3>
        <canvas id="analyticsChart"></canvas>
      </div>
      <div class="card" id="customizationSection">
        <h3>Customization</h3>
        <label for="themeSelect">Theme:</label>
        <select id="themeSelect">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </div>
  </div>

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;

      if (!email || !password) {
        showMsg('Enter email and password');
        return;
      }

      try {
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) {
          showMsg('LOGIN FAILED: ' + error.message);
          return;
        }

        if (remember) {
          localStorage.setItem('rememberMe', true);
          localStorage.setItem('email', email);
        } else {
          localStorage.removeItem('rememberMe');
          localStorage.removeItem('email');
        }

        await afterLogin();
      } catch (e) {
        showMsg('Error: ' + e.message);
      }
    }

    async function doRegister() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || password.length < 6) {
        showMsg('Enter valid email and password min 6 chars');
        return;
      }

      try {
        const { data, error } = await client.auth.signUp({ email, password });
        if (error) {
          showMsg('SIGNUP FAILED: ' + error.message);
          return;
        }

          return;
        }

      }
