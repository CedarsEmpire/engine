<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedars Empire - Member Dashboard</title>
    <style>
        /* Your existing styles */
    </style>
</head>
<body>
    <!-- Your existing topbar and tabs -->
    
    <!-- OVERVIEW TAB -->
    <div id="tab-overview">
        <!-- Your existing content -->
        <div id="live-market" style="background:#fef3c7;color:#92400e;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px;">
            Loading live market...
        </div>
    </div>

    <!-- WALLET & EXCHANGE TAB -->
    <div id="tab-wallet" style="display:none;">
        <!-- Your existing wallet content -->
        <div style="margin-top:16px;background:#0f172a;padding:16px;border-radius:12px;">
            <h4 style="margin:0 0 10px 0;">Quick Exchange</h4>
            <label>Amount in GBP</label>
            <input id="ex-amount" type="number" value="100" style="width:100%;padding:10px;border-radius:8px;margin:6px 0 10px 0;">
            <label>Convert To</label>
            <select id="ex-to" style="width:100%;padding:10px;border-radius:8px;margin:6px 0 10px 0;">
                <option value="tether">USDT</option>
                <option value="bitcoin">BTC</option>
                <option value="ethereum">ETH</option>
            </select>
            <button onclick="getRate()" style="width:100%;padding:12px;background:#16a34a;color:white;border:none;border-radius:8px;font-weight:bold;">Get Live Rate</button>
            <div id="ex-result" style="margin-top:10px;font-size:14px;">Enter amount and get live rate.</div>
            <button onclick="confirmExchange()" style="width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:8px;font-weight:bold;margin-top:8px;">Confirm Exchange</button>
            <div id="exchange-history" style="margin-top:12px;font-size:14px;"></div>
        </div>
    </div>

    <script>
        // Your existing tab switching function
        function showTab(id){
            // Your existing code
        }

        async function loadMarket(){
            try{
                const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether&vs_currencies=gbp');
                const d = await r.json();
                document.getElementById('live-market').innerHTML = 'Live Market: BTC £' + d.bitcoin.gbp + ' | ETH £' + d.ethereum.gbp + ' | USDT £' + d.tether.gbp;
            }catch(e){
                document.getElementById('live-market').innerText = 'Live market temporarily unavailable';
            }
        }
        loadMarket();

        let lastResult = "";
        let exHistory = [];
        async function getRate(){
            const amt = parseFloat(document.getElementById('ex-amount').value);
            const to = document.getElementById('ex-to').value;
            const el = document.getElementById('ex-result');
            if(!amt || amt<=0){ el.innerText="Enter a valid amount"; return; }
            el.innerText="Fetching live rate...";
            try{
                const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+to+'&vs_currencies=gbp');
                const d = await r.json();
                const rate = d[to].gbp;
                const got = amt / rate;
                const {label,formatted} = formatLabel(to);
                lastResult = amt+" GBP = "+got.toFixed(6)+" "+label+" (1 "+label+" = £"+rate+")";
                el.innerText = lastResult;
            }catch(e){ el.innerText="Failed to fetch rate. Try again."; lastResult=""; }
        }
        function confirmExchange(){
            if(!lastResult){ alert('Get live rate first'); return; }
            exHistory.unshift(lastResult + " - " + new Date().toLocaleString());
            document.getElementById('exchange-history').innerHTML = '<b>Exchange History:</b><br>' + exHistory.map(h=>'<div style="padding:6px 0;border-bottom:1px solid #334155;">'+h+'</div>').join('');
            alert('Exchange confirmed!');
        }
        function formatLabel(to){
            const label = to==='tether' ? 'USDT' : to.toUpperCase();
            return {label, formatted: label};
        }
        function goToWallet(){
            document.querySelectorAll('button').forEach(b=>{ if(b.innerText.includes('Wallet')) b.click(); });
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
