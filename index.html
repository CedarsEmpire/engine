<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Cedars Empire</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial,sans-serif;background:#f3f5f7;display:flex;justify-content:center;padding:40px} .card{background:#fff;padding:24px;border-radius:14px;width:100%;max-width:380px} input{width:100%;padding:11px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box} button{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:8px;cursor:pointer} a{color:#1e40af}</style>
</head>
<body>
<div class="card">
<h2>Cedars Empire Login</h2>
<p>Login to see your dashboard in £ GBP</p>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="signup()" style="background:#fff;color:#111;border:1px solid #111;margin-top:10px">Create Account</button>
<p id="msg"></p>
</div>
<script>
const SUPABASE_URL = "https://ipyvewpjtpgfuqfwizlr.supabase.co";
const SUPABASE_KEY = "sb_publishable_0rAiG41KwNmToFlG91RbyQ_K8bJSBdj";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function login(){
 const {error} = await supabaseClient.auth.signInWithPassword({email:document.getElementById('email').value, password:document.getElementById('password').value});
 if(error) document.getElementById('msg').innerText = error.message;
 else window.location.href="index.html";
}
async function signup(){
 const {error} = await supabaseClient.auth.signUp({email:document.getElementById('email').value, password:document.getElementById('password').value});
 document.getElementById('msg').innerText = error ? error.message : "Check your email to confirm, then Login";
}
</script>
</body>
</html>
