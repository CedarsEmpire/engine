<button onclick="confirmExchange()" style="width:100%; padding:12px; background:#2563eb; color:white; border:none; border-radius:8px; font-weight:bold; margin-top:8px;">Confirm Exchange</button>
<div id="exchange-history" style="margin-top:16px; color:white;"></div>

<script>
let history = [];
function confirmExchange(){
  const amt = document.getElementById('ex-amount').value;
  const to = document.getElementById('ex-to').value;
  const resEl = document.getElementById('ex-result').innerText;
  if(resEl.includes('Failed') || !resEl){
    alert('Get live rate first');
    return;
  }
  history.push(`${amt} GBP → ${to.toUpperCase() === 'TETHER' ? 'USDT' : to.toUpperCase()} - ${new Date().toLocaleTimeString()}`);
  document.getElementById('exchange-history').innerHTML = '<h4 style="margin:0 0 8px 0;">Exchange History:</h4>' + history.map(h => `<p style="margin:4px 0;">${h}</p>`).join('');
}
</script>
