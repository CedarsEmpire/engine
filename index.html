<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cedars Empire</title>
  <style>
    /* Desktop styles */
    @media (min-width: 768px) {
      .container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 20px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .grid4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
    }

    /* Tablet styles */
    @media (max-width: 767px) {
      .container {
        max-width: 90%;
        margin: 20px auto;
        padding: 10px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .grid4 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
    }

    /* Mobile styles */
    @media (max-width: 480px) {
      .container {
        max-width: 100%;
        margin: 10px auto;
        padding: 5px;
      }
      .grid2, .grid3, .grid4 {
        display: block;
      }
      .card {
        margin-bottom: 10px;
      }
    }

    .card {
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .card-content {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .button {
      border-radius: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .button:hover {
      background-color: #ccc;
    }

    /* Robotic engine styles */
    .robotic-engine {
      position: relative;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background-color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .engine-container {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-color: #444;
    }

    .engine-core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: #666;
    }

    .engine-piston {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(0deg);
      width: 40px;
      height: 10px;
      background-color: #888;
      animation: piston-move 2s infinite;
    }

    .piston-2 {
      animation-delay: 0.5s;
    }

    .piston-3 {
      animation-delay: 1s;
    }

    @keyframes piston-move {
      0% {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      50% {
        transform: translate(-50%, -50%) rotate(180deg);
      }
      100% {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <!-- Dashboard content -->
  <div class="container">
    <!-- Robotic engine -->
    <div class="robotic-engine">
      <div class="engine-container">
        <div class="engine-core"></div>
        <div class="engine-piston"></div>
        <div class="engine-piston piston-2"></div>
        <div class="engine-piston piston-3"></div>
      </div>
    </div>

    <!-- Dashboard cards -->
    <div class="grid4">
      <div class="card">
        <div class="card-header">Total Earned</div>
        <div class="card-content">$224.37</div>
      </div>
      <div class="card">
        <div class="card-header">Available Balance</div>
        <div class="card-content">$13.87</div>
      </div>
      <div class="card">
        <div class="card-header">Today's Earnings</div>
        <div class="card-content">$42.00</div>
      </div>
      <div class="card">
        <div class="card-header">Referral Bonus</div>
        <div class="card-content">$315.00</div>
      </div>
    </div>

    <!-- Deposit and withdrawal sections -->
    <div class="grid2">
      <div class="card">
        <div class="card-header">Deposit</div>
        <div class="card-content">
          <form>
            <label for="deposit-amount">Amount:</label>
            <input type="number" id="deposit-amount" value="5000">
            <button class="button">Deposit</button>
          </form>
        </div>
      </div>
      <div class="card">
        <div class="card-header">Withdrawal</div>
        <div class="card-content">
          <form>
            <label for="withdrawal-amount">Amount:</label>
            <input type="number" id="withdrawal-amount" value="100">
            <button class="button">Withdraw</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Update system stats every second
    setInterval(() => {
      const cpuUsage = Math.floor(Math.random() * 100);
      const memoryUsage = Math.floor(Math.random() * 100);
      const systemUptime = Math.floor(Math.random() * 24);

      // document.getElementById('cpu-usage').textContent = `${cpuUsage}%`;
      // document.getElementById('memory-usage').textContent = `${memoryUsage}%`;
      // document.getElementById('system-uptime').textContent = `${systemUptime} hours`;
    }, 1000);
  </script>
</body>
</html>
