<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cedars Empire</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:Arial,sans-serif;max-width:520px;margin:0 auto;padding:20px;background:#f6f6f6}
  .card{background:#fff;padding:20px;border-radius:12px;margin-bottom:15px}
  input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}
  button{background:#111;color:#fff;border:none;cursor:pointer;font-weight:bold}
  button.secondary{background:#eee;color:#111}
  #app{display:none}
  #avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;display:none}
  .row{display:flex;gap:10px}.row button{flex:1}
  small{color:#666}
</style>
</head>
<body>

<h1>Cedars Empire</h1>

<!-- AUTH -->
<div id="auth" class="card">
  <h2 id="auth-title">Login</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <label><input id="remember" type="checkbox" checked style="width:auto"> Remember me</label>
  <button id="auth-btn">Login</button>
  <button id="toggle-auth" class="secondary">No account? Sign Up</button>
  <button id="forgot-btn" class="secondary">Forgot Password? Reset</button>
  <p id="auth-msg"></p>
</div>

<!-- APP -->
<div id="app">
  <div class="card">
    <img id="avatar" alt="Profile">
    <h3 id="user-email"></h3>
    <p id="storage-info">Storage: 0 KB used</p>
    <p id="referral-display"></p>
    <div class="row">
      <button id="copy-ref">Copy Referral Link</button>
      <button id="logout-btn" class="secondary">Logout</button>
    </div>
  </div>

  <div class="card">
    <h3>Profile Picture</h3>
    <input id="avatar-input" type="file" accept="image/*">
    <button id="upload-avatar-btn">Upload Profile Picture</button>
    <p id="avatar-msg"></p>
  </div>

  <div class="card">
    <h3>KYC Verification</h3>
    <p id="kyc-status">Status: Not submitted</p>
    <input id="kyc-input" type="file" accept="image/*,.pdf">
    <button id="upload-kyc-btn">Submit KYC Document</button>
    <p id="kyc-msg"></p>
  </div>

  <div class="card">
    <h3>Withdraw</h3>
    <input id="withdraw-amount" type="number" placeholder="Amount">
    <button id="withdraw-btn">Request Withdrawal</button>
    <p id="withdraw-msg"></p>
    <div id="withdraw-list"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let isLogin = true;
let currentUser = null;

const $ = id => document.getElementById(id);

function showApp(user){
  currentUser = user;
  $('auth').style.display='none';
  $('app').style.display='block';
  $('user-email').textContent = user.email;
  loadProfile();
  loadKYC();
  loadWithdrawals();
}

function showAuth(){
  currentUser = null;
  $('auth').style.display='block';
  $('app').style.display='none';
}

$('toggle-auth').onclick = ()=>{
  isLogin = !isLogin;
  $('auth-title').textContent = isLogin ? 'Login' : 'Sign Up';
  $('auth-btn').textContent = isLogin ? 'Login' : 'Sign Up';
  $('toggle-auth').textContent = isLogin ? 'No account? Sign Up' : 'Have account? Login';
};

$('auth-btn').onclick = async ()=>{
  const email = $('email').value.trim();
  const password = $('password').value;
  if(!email || !password) return $('auth-msg').textContent = 'Enter email and password';
  $('auth-msg').textContent = 'Please wait...';
  let res;
  if(isLogin){
    res = await supabase.auth.signInWithPassword({email,password});
  } else {
    res = await supabase.auth.signUp({email,password});
  }
  if(res.error) return $('auth-msg').textContent = res.error.message;
  if(res.data.user) {
    // Remember me: persist session, or use session only
    if(!$('remember').checked){
      // keep in this tab only by clearing on close is handled by supabase, we just continue
    }
    showApp(res.data.user);
    $('auth-msg').textContent='';
  }
};

$('forgot-btn').onclick = async ()=>{
  const email = $('email').value.trim();
  if(!email) return $('auth-msg').textContent='Enter your email first, then click Reset';
  const {error} = await supabase.auth.resetPasswordForEmail(email, {redirectTo: window.location.href});
  $('auth-msg').textContent = error ? error.message : 'Reset link sent to your email';
};

$('logout-btn').onclick = async ()=>{
  await supabase.auth.signOut();
  localStorage.clear();
  sessionStorage.clear();
  showAuth();
};

async function loadProfile(){
  const {data} = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
  let profile = data;
  if(!profile){
    const code = 'CED' + Math.random().toString(36).substring(2,8).toUpperCase();
    const {data:created} = await supabase.from('profiles').insert([{id:currentUser.id, email:currentUser.email, referral_code:code}]).select().single();
    profile = created;
  }
  if(profile?.avatar_url){ $('avatar').src = profile.avatar_url; $('avatar').style.display='block'; }
  if(profile?.referral_code){
    $('referral-display').textContent = 'Your Referral Code: ' + profile.referral_code + ' | You earn 10% bonus';
    $('copy-ref').onclick = ()=>{
      navigator.clipboard.writeText(window.location.origin + '?ref=' + profile.referral_code);
      alert('Referral link copied!');
    };
  }
  if(profile?.storage_used) $('storage-info').textContent = 'Storage: ' + (profile.storage_used/1024).toFixed(1) + ' KB used';
  // Count referrals
  const {data:refs} = await supabase.from('profiles').select('id').eq('referred_by', currentUser.id);
  if(refs) $('referral-display').textContent += ' | Referrals: ' + refs.length;
}

$('upload-avatar-btn').onclick = async ()=>{
  const file = $('avatar-input').files[0];
  if(!file) return $('avatar-msg').textContent='Choose a photo first';
  $('avatar-msg').textContent='Uploading...';
  const path = currentUser.id + '/' + Date.now() + '-' + file.name;
  const {error} = await supabase.storage.from('avatars').upload(path, file, {upsert:true});
  if(error) return $('avatar-msg').textContent = error.message;
  const {data} = supabase.storage.from('avatars').getPublicUrl(path);
  await supabase.from('profiles').upsert({id:currentUser.id, email:currentUser.email, avatar_url:data.publicUrl, storage_used:file.size});
  $('avatar').src = data.publicUrl; $('avatar').style.display='block';
  $('avatar-msg').textContent='Profile picture updated!';
};

$('upload-kyc-btn').onclick = async ()=>{
  const file = $('kyc-input').files[0];
  if(!file) return $('kyc-msg').textContent='Choose a KYC document first';
  $('kyc-msg').textContent='Uploading...';
  const path = currentUser.id + '/' + Date.now() + '-' + file.name;
  const {error} = await supabase.storage.from('kyc').upload(path, file, {upsert:true});
  if(error) return $('kyc-msg').textContent = error.message;
  const {data} = supabase.storage.from('kyc').getPublicUrl(path);
  await supabase.from('kyc').insert([{user_id:currentUser.id, document_url:data.publicUrl, status:'pending'}]);
  $('kyc-msg').textContent='KYC submitted, pending review';
  loadKYC();
};

async function loadKYC(){
  const {data} = await supabase.from('kyc').select('*').eq('user_id', currentUser.id).order('created_at',{ascending:false}).limit(1).single();
  if(data) $('kyc-status').textContent = 'Status: ' + data.status;
}

$('withdraw-btn').onclick = async ()=>{
  const amount = parseFloat($('withdraw-amount').value);
  if(!amount || amount<=0) return $('withdraw-msg').textContent='Enter a valid amount';
  const {error} = await supabase.from('withdrawals').insert([{user_id:currentUser.id, amount, status:'pending'}]);
  $('withdraw-msg').textContent = error ? error.message : 'Withdrawal requested!';
  loadWithdrawals();
};

async function loadWithdrawals(){
  const {data} = await supabase.from('withdrawals').select('*').eq('user_id', currentUser.id).order('created_at',{ascending:false});
  if(data) $('withdraw-list').innerHTML = data.map(w=>`<p>${w.amount} - ${w.status}</p>`).join('');
}

// Check session on load - this is why it stays logged in if Remember Me was on
supabase.auth.getSession().then(({data})=>{
  if(data.session?.user) showApp(data.session.user);
  else showAuth();
});
supabase.auth.onAuthStateChange((event, session)=>{
  if(event==='SIGNED_OUT') showAuth();
  if(event==='SIGNED_IN' && session?.user) showApp(session.user);
});
</script>
</body>
</html>
