<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEDARS EMPIRE - Live</title>
  <style>
    /* your styles */
    .authBox {
      max-width: 400px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      background: #fff;
    }
  </style>
</head>
<body>
  <!-- your HTML content -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ipyvewpjtpgfuqfwizlr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VAHMj985hPKE8nPyO8Btcg_Sgmmr3Rm';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;

      if (!email || !password) {
        showMsg('Enter email and password');
        return;
      }

      try {
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) {
          showMsg('LOGIN FAILED: ' + error.message);
          return;
        }

        if (remember) {
          localStorage.setItem('rememberMe', true);
          localStorage.setItem('email', email);
        } else {
          localStorage.removeItem('rememberMe');
          localStorage.removeItem('email');
        }

        showMsg('Login successful!');
        // Add logic to display dashboard after login
      } catch (e) {
        showMsg('Error: ' + e.message);
      }
    }

    async function doRegister() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || password.length < 6) {
        showMsg('Enter valid email and password min 6 chars');
        return;
      }

      try {
        const { data, error } = await client.auth.signUp({ email, password });
        if (error) {
          showMsg('SIGNUP FAILED: ' + error.message);
          return;
        }

        showMsg('Account created!');
        // Add logic to display dashboard after registration
      } catch (e) {
        showMsg('Error: ' + e.message);
      }
    }

    function showMsg(message) {
      document.getElementById('authMsg').innerText = message;
    }

    // Populate email field if remember me is enabled
    if (localStorage.getItem('rememberMe')) {
      document.getElementById('email').value = localStorage.getItem('email');
      document.getElementById('rememberMe').checked = true;
    }
  </script>
</body>
</html>
