<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Supabase App</h1>
    <button id="login-btn">Login</button>
    <button id="logout-btn" style="display:none;">Logout</button>
    <button id="kyc-btn" style="display:none;">Submit KYC</button>
    <input id="kyc-file" type="file" style="display:none;">
    <button id="withdraw-btn" style="display:none;">Request Withdrawal</button>
    <input id="amount" type="number" style="display:none;">
    <div id="profile" style="display:none;">
        <h2>Profile</h2>
        <p id="email"></p>
        <img id="avatar" src="" alt="Avatar">
    </div>

    <script>
        const supabaseUrl = 'YOUR_SUPABASE_URL';
        const supabaseAnonKey = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = Supabase.createClient(supabaseUrl, supabaseAnonKey);

        document.getElementById('login-btn').addEventListener('click', async () => {
            const { user, error } = await supabase.auth.signIn({
                email: 'user@example.com',
                password: 'password',
            });
            if (error) console.error(error);
            else {
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'block';
                document.getElementById('kyc-btn').style.display = 'block';
                document.getElementById('withdraw-btn').style.display = 'block';
                document.getElementById('amount').style.display = 'block';
                document.getElementById('profile').style.display = 'block';
                document.getElementById('email').innerText = user.email;
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            document.getElementById('login-btn').style.display = 'block';
            document.getElementById('logout-btn').style.display = 'none';
            document.getElementById('kyc-btn').style.display = 'none';
            document.getElementById('withdraw-btn').style.display = 'none';
            document.getElementById('amount').style.display = 'none';
            document.getElementById('profile').style.display = 'none';
        });

        document.getElementById('kyc-btn').addEventListener('click', () => {
            document.getElementById('kyc-file').click();
        });

        document.getElementById('kyc-file').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const { data, error } = await supabase.storage.from('kyc').upload(`public/${file.name}`, file);
            if (error) console.error(error);
            else console.log('KYC document uploaded successfully');
        });

        document.getElementById('withdraw-btn').addEventListener('click', async () => {
            const amount = document.getElementById('amount').value;
            const { data, error } = await supabase.from('withdrawals').insert([{ amount }]);
            if (error) console.error(error);
            else console.log('Withdrawal request submitted');
        });
    </script>
</body>
</html>
