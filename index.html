<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdrawal System</title>
  <style>
    /* Add your styles here */
  </style>
</head>
<body>
  <!-- User dashboard -->
  <div id="user-dashboard">
    <h1>User Dashboard</h1>
    <p>Balance: £<span id="balance">0</span></p>
    <input id="withdrawal-amount" type="number" placeholder="Enter withdrawal amount">
    <button id="withdraw-btn">Withdraw</button>
  </div>

  <!-- Admin dashboard -->
  <div id="admin-dashboard" style="display: none;">
    <h1>Admin Dashboard</h1>
    <h2>Withdrawal Requests</h2>
    <table id="withdrawal-requests">
      <thead>
        <tr>
          <th>ID</th>
          <th>User ID</th>
          <th>Amount</th>
          <th>Fee</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="withdrawal-requests-body">
        <!-- Withdrawal requests will be displayed here -->
      </tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ipyvewpjtpgfuqfwizlr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VAHMj985hPKE8nPyO8Btcg_Sgmmr3Rm';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let earned = 0;

    // Get user data
    client.auth.getSession().then(({ data }) => {
      if (data.session) {
        currentUser = data.session.user;
        getBalance();
        getWithdrawalRequests();
      }
    });

    // Get balance
    async function getBalance() {
      const { data: profile } = await client
        .from('profiles')
        .select('balance')
        .eq('id', currentUser.id)
        .single();
      earned = profile.balance;
      document.getElementById('balance').innerText = earned;
    }

    // Withdraw
    document.getElementById('withdraw-btn').addEventListener('click', async () => {
      const amount = parseFloat(document.getElementById('withdrawal-amount').value);
      if (amount < 10 || amount > 30000) {
        alert('Withdrawal amount must be between £10 and £30,000');
        return;
      }

      if (earned < amount) {
        alert('Insufficient balance');
        return;
      }

      const withdrawalFee = amount * 0.2;
      const totalAmount = amount + withdrawalFee;

      if (earned < totalAmount) {
        alert('Insufficient balance to cover withdrawal fee');
        return;
      }

      try {
        // Create withdrawal request
        await client.from('withdrawal_requests').insert({
          user_id: currentUser.id,
          amount,
          fee: withdrawalFee,
          status: 'pending',
        });

        alert('Withdrawal request submitted. Please wait for admin approval.');
      } catch (error) {
        alert('Withdrawal request failed: ' + error.message);
      }
    });

    // Get withdrawal requests
    async function getWithdrawalRequests() {
      const { data: requests } = await client.from('withdrawal_requests').select('*');
      const requestsBody = document.getElementById('withdrawal-requests-body');
      requestsBody.innerHTML = '';
      requests.forEach((request) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${request.id}</td>
          <td>${request.user_id}</td>
          <td>${request.amount}</td>
          <td>${request.fee}</td>
          <td>${request.status}</td>
          <td>
            <button onclick="approveWithdrawal(${request.id})">Approve</button>
            <button onclick="rejectWithdrawal(${request.id})">Reject</button>
          </td>
        `;
        requestsBody.appendChild(row);
      });
    }

    // Approve withdrawal
    async function approveWithdrawal(requestId) {
      try {
        // Get withdrawal request
        const { data: request } = await client
          .from('withdrawal_requests')
          .select('*')
          .eq('id', requestId)
          .single();

        // Update user balance
        await client
          .from('profiles')
          .update({ balance: earned - request.amount - request.fee })
          .eq('id', request.user_id);

        // Update withdrawal request status
        await client
          .from('withdrawal_requests')
          .update({ status: 'approved' })
          .eq('id', requestId);

        alert('Withdrawal approved');
        getWithdrawalRequests();
      } catch (error) {
        alert('Error approving withdrawal: ' + error.message);
      }
    }

    // Reject withdrawal
    async function rejectWithdrawal(requestId) {
      try {
        // Update withdrawal request status
        await client
          .from('withdrawal_requests')
          .update({ status: 'rejected' })
          .eq('id', requestId);

        alert('Withdrawal rejected');
        getWithdrawalRequests();
      } catch (error) {
        alert('Error rejecting withdrawal: ' + error.message);
      }
    }
  </script>
</body>
</html>
