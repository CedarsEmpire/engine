    function showMsg(t){ document.getElementById('authMsg').innerText = t; }

    async function doRegister(){
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if(!email || password.length < 6){ showMsg('Enter valid email and password min 6 chars'); return; }
      showMsg('Creating account...');
      const { data, error } = await client.auth.signUp({ email, password });
      if(error){ showMsg(error.message); return; }
      showMsg('Account created! Logging you in...');
      await afterLogin();
    }

    async function doLogin(){
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      showMsg('Logging in...');
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if(error){ showMsg(error.message); return; }
      await afterLogin();
    }

    async function doLogout(){ await client.auth.signOut(); location.reload(); }

    async function afterLogin(){
      const { data } = await client.auth.getUser();
      if(!data.user) return;
      currentUser = data.user;
      document.getElementById('userEmail').innerText = currentUser.email;
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('dashSection').style.display = 'block';
      // ensure profile + balance rows exist
      await client.from('profiles').upsert({ id: currentUser.id, email: currentUser.email });
      let { data: bal } = await client.from('balances').select('amount').eq('user_id', currentUser.id).single();
      if(!bal){ await client.from('balances').insert({ user_id: currentUser.id, amount: 0 }); earned = 0; }
      else { earned = parseFloat(bal.amount || 0); }
      updateDisplay(); renderEngines(); runCycle(); loadTxCount();
    }
