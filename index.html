<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login/Register</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .authBox {
      max-width: 400px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="authBox">
    <h2>Login/Register</h2>
    <label>Email:</label>
    <input id="email" type="email" placeholder="Enter email">
    <label>Password:</label>
    <input id="password" type="password" placeholder="Enter password">
    <button id="loginBtn" onclick="doLogin()">Login</button>
    <button id="registerBtn" onclick="doRegister()">Register</button>
    <div id="message"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://ipyvewpjtpgfuqfwizlr.supabase.co';
    const supabaseKey = 'sb_publishable_VAHMj985hPKE8nPyO8Btcg_Sgmmr3Rm';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function doLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          console.error('Login error:', error);
          document.getElementById('message').innerText = 'Login failed: ' + error.message;
        } else {
          console.log('Login successful:', data);
          document.getElementById('message').innerText = 'Login successful!';
        }
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('message').innerText = 'Error: ' + error.message;
      }
    }

    async function doRegister() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) {
          console.error('Register error:', error);
          document.getElementById('message').innerText = 'Register failed: ' + error.message;
        } else {
          console.log('Register successful:', data);
          document.getElementById('message').innerText = 'Register successful!';
        }
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('message').innerText = 'Error: ' + error.message;
      }
    }
  </script>
</body>
</html>
