<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Register</title>
<style>
    * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: Arial, sans-serif;
    padding: 16px;
  }
  .authBox {
    width: 100%;
    max-width: 420px;
    background: #fff;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }
  .authBox h2 { margin: 0 0 20px; font-size: 24px; }
  label { display: block; font-weight: bold; margin: 14px 0 6px; font-size: 14px; }
  input {
    display: block;
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    outline: none;
  }
  input:focus { border-color: #2563eb; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  button {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #fff;
    background: #2563eb;
  }
  button.secondary { background: #16a34a; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; cursor: wait; }
  #message {
    margin-top: 16px;
    min-height: 22px;
    font-size: 14px;
    font-weight: bold;
    color: #dc2626;
    word-break: break-word;
  }
  #message.ok { color: #16a34a; }
</style>
</head>
<body>

<div class="authBox">
  <h2>Login / Register</h2>

  <label for="email">Email</label>
  <input id="email" type="email" placeholder="Enter email" autocomplete="email">

  <label for="password">Password</label>
  <input id="password" type="password" placeholder="Enter password" autocomplete="current-password">

  <div class="row">
    <button id="loginBtn" type="button">Login</button>
    <button id="registerBtn" type="button" class="secondary">Create Account</button>
  </div>

  <div id="message"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // 1. Check library loaded
  if (!window.supabase) {
    document.getElementById('message').textContent = 'ERROR: Supabase library did not load. Check internet / CDN.';
    throw new Error('Supabase lib missing');
  }

  const SUPABASE_URL = 'https://ipyvewpjtpgfuqfwizlr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_VAHMj985hPKE8nPyO8Btcg_Sgmmr3Rm';
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const emailEl = document.getElementById('email');
  const passEl = document.getElementById('password');
  const msgEl = document.getElementById('message');
  const loginBtn = document.getElementById('loginBtn');
  const registerBtn = document.getElementById('registerBtn');

  function showMsg(text, ok = false) {
    msgEl.textContent = text;
    msgEl.className = ok ? 'ok' : '';
    console.log(text);
  }

  async function doLogin() {
    const email = emailEl.value.trim();
    const password = passEl.value;
    if (!email || !password) return showMsg('Please enter email and password');
    loginBtn.disabled = true;
    showMsg('Logging in...');
    try {
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) showMsg('Login failed: ' + error.message);
      else showMsg('Login successful! Welcome ' + (data.user?.email || ''), true);
    } catch (e) {
      showMsg('Error: ' + e.message);
    }
    loginBtn.disabled = false;
  }

  async function doRegister() {
    const email = emailEl.value.trim();
    const password = passEl.value;
    if (!email || !password) return showMsg('Please enter email and password');
    if (password.length < 6) return showMsg('Password must be at least 6 characters');
    registerBtn.disabled = true;
    showMsg('Creating account...');
    try {
      const { data, error } = await client.auth.signUp({ email, password });
      if (error) showMsg('Register failed: ' + error.message);
      else showMsg('Register successful! Check email if confirmation is required.', true);
    } catch (e) {
      showMsg('Error: ' + e.message);
    }
    registerBtn.disabled = false;
  }

  // This is why your old buttons felt dead - now wired properly
  loginBtn.addEventListener('click', doLogin);
  registerBtn.addEventListener('click', doRegister);

  console.log('Auth ready');
</script>
</body>
</html>
