<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h2>Member Dashboard</h2>
<p id="userEmail"></p>
<button id="logoutBtn">Logout</button>
<hr>

<h3>Available Balance</h3>
<p id="balance">£0.00</p>

<h3>Total Deposited</h3>
<p id="totalDeposited">£0.00</p>

<h3>Total Withdrawn</h3>
<p id="totalWithdrawn">£0.00</p>

<h3>Your Referral Code</h3>
<p id="referralCode">-</p>
<p>Share this code. Referrals are tracked in Supabase.</p>
<hr>

<!-- DEPOSIT -->
<h3>Deposit</h3>
<form id="depositForm">
  <label>Amount £</label><br>
  <input type="number" id="depositAmount" placeholder="Amount £" required><br><br>
  <label>Method</label><br>
  <select id="depositMethod">
    <option>Bank Transfer</option>
    <option>Crypto</option>
    <option>Cash</option>
  </select><br><br>
  <button type="submit">Request Deposit</button>
</form>
<hr>

<!-- WITHDRAW -->
<h3>Withdraw</h3>
<form id="withdrawForm">
  <label>Amount £</label><br>
  <input type="number" id="withdrawAmount" placeholder="Amount £" required><br><br>
  <label>Destination - bank / wallet address</label><br>
  <input type="text" id="withdrawDest" placeholder="Destination - bank / wallet address" required><br><br>
  <button type="submit">Request Withdrawal</button>
</form>
<p>Fee is calculated from your settings table, not hard-coded.</p>
<hr>

<!-- SEND CRYPTO -->
<h3>Send Crypto</h3>
<form id="sendForm">
  <label>Amount</label><br>
  <input type="number" id="sendAmount" placeholder="Amount" required><br><br>
  <label>Currency</label><br>
  <select id="sendCurrency">
    <option>BTC</option>
    <option>ETH</option>
    <option>USDT</option>
  </select><br><br>
  <label>Recipient wallet address</label><br>
  <input type="text" id="sendTo" placeholder="Recipient wallet address" required><br><br>
  <button type="submit">Send</button>
</form>
<hr>

<!-- EXCHANGE -->
<h3>Exchange</h3>
<form id="exchangeForm">
  <label>Amount</label><br>
  <input type="number" id="exchangeAmount" placeholder="Amount" required><br><br>
  <label>From</label><br>
  <select id="exchangeFrom">
    <option>GBP</option>
    <option>BTC</option>
    <option>ETH</option>
    <option>USDT</option>
  </select><br><br>
  <label>To</label><br>
  <select id="exchangeTo">
    <option>BTC</option>
    <option>GBP</option>
    <option>ETH</option>
    <option>USDT</option>
  </select><br><br>
  <button type="submit">Create Exchange Request</button>
</form>
<hr>

<p id="msg"></p>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadUser(){
  const { data: { user } } = await supabaseClient.auth.getUser();
  if(!user){ window.location.href = "login.html"; return; }
  document.getElementById('userEmail').innerText = user.email;

  const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
  if(profile){
    document.getElementById('balance').innerText = "£" + (profile.balance || 0);
    document.getElementById('totalDeposited').innerText = "£" + (profile.total_deposited || 0);
    document.getElementById('totalWithdrawn').innerText = "£" + (profile.total_withdrawn || 0);
    document.getElementById('referralCode').innerText = profile.referral_code || "-";
  }
}
loadUser();

document.getElementById('logoutBtn').onclick = async () => {
  await supabaseClient.auth.signOut();
  window.location.href = "login.html";
};

document.getElementById('depositForm').onsubmit = async (e) => {
  e.preventDefault();
  const { data: { user } } = await supabaseClient.auth.getUser();
  const { error } = await supabaseClient.from('deposits').insert([{
    user_id: user.id,
    amount: parseFloat(document.getElementById('depositAmount').value),
    method: document.getElementById('depositMethod').value,
    status: 'pending'
  }]);
  document.getElementById('msg').innerText = error ? error.message : "Deposit request created";
};

document.getElementById('withdrawForm').onsubmit = async (e) => {
  e.preventDefault();
  const { data: { user } } = await supabaseClient.auth.getUser();
  const { error } = await supabaseClient.from('withdrawals').insert([{
    user_id: user.id,
    amount: parseFloat(document.getElementById('withdrawAmount').value),
    destination: document.getElementById('withdrawDest').value,
    status: 'pending'
  }]);
  document.getElementById('msg').innerText = error ? error.message : "Withdrawal request created";
};

document.getElementById('sendForm').onsubmit = async (e) => {
  e.preventDefault();
  const { data: { user } } = await supabaseClient.auth.getUser();
  const { error } = await supabaseClient.from('transfers').insert([{
    user_id: user.id,
    amount: parseFloat(document.getElementById('sendAmount').value),
    currency: document.getElementById('sendCurrency').value,
    recipient_address: document.getElementById('sendTo').value,
    status: 'pending'
  }]);
  document.getElementById('msg').innerText = error ? error.message : "Send request created";
};

document.getElementById('exchangeForm').onsubmit = async (e) => {
  e.preventDefault();
  const { data: { user } } = await supabaseClient.auth.getUser();
  const { error } = await supabaseClient.from('exchanges').insert([{
    user_id: user.id,
    amount: parseFloat(document.getElementById('exchangeAmount').value),
    from_currency: document.getElementById('exchangeFrom').value,
    to_currency: document.getElementById('exchangeTo').value,
    status: 'pending'
  }]);
  document.getElementById('msg').innerText = error ? error.message : "Exchange request created";
};
</script>
</body>
</html>
