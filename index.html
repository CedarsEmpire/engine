<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cedars Empire</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700&display=swap">
  <style>
    /* Modern dashboard layout */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f7f7f7;
    }
    .dashboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .card {
      background-color: #fff;
      border: 1px solid #ddd;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    /* Customizable UI components */
    .btn {
      background-color: #4CAF50;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #3e8e41;
    }
    /* Responsive design elements */
    @media (max-width: 768px) {
      .dashboard {
        flex-direction: column;
      }
      .card {
        margin-bottom: 10px;
      }
    }
    /* Interactive charts and graphs */
    .chart {
      width: 100%;
      height: 300px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="card">
      <h3>Register</h3>
      <form id="register-form">
        <label>Username</label>
        <input type="text" id="username" placeholder="e.g. john123" />
        <label>Email</label>
        <input type="email" id="email" placeholder="e.g. john@example.com" />
        <label>Password</label>
        <input type="password" id="password" placeholder="e.g. password123" />
        <button class="btn" id="register-btn">Sign Up</button>
      </form>
    </div>
    <div class="card">
      <h3>Redeem</h3>
      <form id="redeem-form">
        <label>Redemption Code</label>
        <input type="text" id="redeem-code" placeholder="e.g. ABC123" />
        <label>Amount (£)</label>
        <input type="number" id="redeem-amount" placeholder="e.g. 100" />
        <button class="btn" id="redeem-btn">Redeem</button>
      </form>
    </div>
    <div class="card">
      <h3>Live Chat</h3>
      <button class="btn" id="live-chat-btn">Start Chat</button>
      <div id="live-chat-container" style="display: none;">
        <textarea id="live-chat-input" placeholder="Type your message..."></textarea>
        <button class="btn" id="live-chat-send">Send</button>
        <div id="live-chat-log"></div>
      </div>
    </div>
    <div class="card">
      <h3>Charts and Graphs</h3>
      <div class="chart" id="chart-1"></div>
      <div class="chart" id="chart-2"></div>
    </div>
  </div>

  <script>
    // Register form submission
    document.getElementById('register-btn').addEventListener('click', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      // Add registration logic here
      console.log('Register form submitted:', username, email, password);
    });

    // Redeem form submission
    document.getElementById('redeem-btn').addEventListener('click', (e) => {
      e.preventDefault();
      const redeemCode = document.getElementById('redeem-code').value;
      const redeemAmount = document.getElementById('redeem-amount').value;
      // Add redemption logic here
      console.log('Redeem form submitted:', redeemCode, redeemAmount);
    });

    // Live chat functionality
    document.getElementById('live-chat-btn').addEventListener('click', () => {
      document.getElementById('live-chat-container').style.display = 'block';
    });

    document.getElementById('live-chat-send').addEventListener('click', () => {
      const message = document.getElementById('live-chat-input').value;
      // Add live chat logic here
      console.log('Live chat message sent:', message);
      document.getElementById('live-chat-log').innerHTML += `<p>You: ${message}</p>`;
      document.getElementById('live-chat-input').value = '';
    });

    // Charts and graphs
    // Add charting library (e.g. Chart.js) and create charts here
  </script>
</body>
</html>
