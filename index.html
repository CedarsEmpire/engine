<!DOCTYPE html>
<html lang="en">
<head>
  <!-- existing head content -->
</head>
<body>
  <!-- existing body content -->
  <script>
    // existing script content
    
    // Create a function to update the balance tables
    async function updateBalanceTables(reward) {
      if (!currentUser) return;
      
      // Get the current balances
      let { data } = await client.from('balances').select('available_balance', 'reserved_balance', 'earned_balance', 'central_reserve').eq('user_id', currentUser.id).single();
      let currentAvailableBalance = data ? parseFloat(data.available_balance) : 0;
      let currentReservedBalance = data ? parseFloat(data.reserved_balance) : 0;
      let currentEarnedBalance = data ? parseFloat(data.earned_balance) : 0;
      let currentCentralReserve = data ? parseFloat(data.central_reserve) : 0;
      
      // Calculate the amounts to add to each balance
      let availableBalanceAmount = reward * 0.2;
      let centralReserveAmount = reward * 0.8;
      
      // Update the balances
      await client.from('balances').upsert({
        user_id: currentUser.id,
        available_balance: currentAvailableBalance + availableBalanceAmount,
        reserved_balance: currentReservedBalance,
        earned_balance: currentEarnedBalance + reward,
        central_reserve: currentCentralReserve + centralReserveAmount
      });
    }
    
    // Modify the runCycle function to update the balance tables
    async function runCycle() {
      if (!currentUser) return;
      let activeEngines = engines.filter(e => e.on);
      if (activeEngines.length === 0) return;
      let e = activeEngines[Math.floor(Math.random() * activeEngines.length)];
      let w = workerNames[Math.floor(Math.random() * workerNames.length)];
      let reward = (Math.random() * 0.5 + 0.3);
      earned += reward;
      totalTasks++;
      e.tasks++;
      
      // Update the balance tables
      await updateBalanceTables(reward);
      
      // Update the display
      updateDisplay();
      
      // ... rest of the code
    }
    
    // Modify the updateDisplay function to display the balances
    function updateDisplay() {
      // Get the current balances
      client.from('balances').select('available_balance', 'reserved_balance', 'earned_balance', 'central_reserve').eq('user_id', currentUser.id).single().then(({ data }) => {
        document.getElementById('earned').innerText = "€" + earned.toFixed(2);
        document.getElementById('withdrawBal').innerText = "€" + (data ? parseFloat(data.available_balance).toFixed(2) : 0);
        let pct = Math.min(100, (earned / 2500 * 100));
        document.getElementById('pct').innerText = pct.toFixed(1) + "%";
        document.getElementById('barFill').style.width = pct + "%";
      });
    }
    
    // Modify the afterLogin function to initialize the balances
    async function afterLogin() {
      // ... rest of the code
      
      // Initialize the balances
      let { data } = await client.from('balances').select('available_balance', 'reserved_balance', 'earned_balance', 'central_reserve').eq('user_id', currentUser.id).single();
      if (!data) {
        await client.from('balances').insert({
          user_id: currentUser.id,
          available_balance: 0,
          reserved_balance: 0,
          earned_balance: 0,
          central_reserve: 0
        });
      }
    }
  </script>
</body>
</html>
