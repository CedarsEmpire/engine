<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEDARS EMPIRE - Live</title>
  <style>
    /* your styles */
  </style>
</head>
<body>
  <div class="top">
    <h1>CEDARS EMPIRE <span class="live">● Live</span></h1>
    <div id="userEmail">👤 Guest</div>
  </div>
  <div id="authSection" class="authBox">
    <h2 style="text-align:center;margin:0;font-size:24px">Login / Register</h2>
    <p style="text-align:center;color:#666;font-size:16px;margin-bottom:20px">Access your account to manage your tasks</p>
    
    <div style="margin-bottom:15px">
      <label style="display:block;margin-bottom:8px;font-weight:500">Email</label>
      <input id="email" type="email" placeholder="Enter your email" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px">
    </div>
    
    <div style="margin-bottom:20px">
      <label style="display:block;margin-bottom:8px;font-weight:500">Password</label>
      <input id="password" type="password" placeholder="Enter your password" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px">
    </div>
    
    <div id="authMsg" style="color:#c00;font-size:14px;min-height:18px;text-align:center;margin-bottom:15px"></div>
    
    <button id="loginBtn" onclick="doLogin()" style="width:100%;padding:14px;border:none;border-radius:8px;background:#0a9d6e;color:#fff;font-weight:bold;font-size:16px;cursor:pointer">
      Login
    </button>
    
    <button id="registerBtn" onclick="doRegister()" style="width:100%;padding:14px;border:none;border-radius:8px;background:#0f1e2e;color:#fff;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px">
      Create Account
    </button>
  </div>
  <div id="dashSection" style="display:none">
    <!-- rest of your dashboard content -->
    <div class="actions">
      <button onclick="alert('Logged in as '+currentUser.email)">👤 Profile</button>
      <button class="green" id="depositBtn" onclick="toggleDeposit()">🏦 Deposit <span id="depositState">ON</span></button>
      <button onclick="document.getElementById('taskSection').scrollIntoView()">☰ Task</button>
      <button onclick="document.getElementById('withdrawSection').style.display='block';document.getElementById('withdrawSection').scrollIntoView()">↗️ Withdraw</button>
      <button onclick="alert('Your Referral: https://cedarsempire.com/register?ref='+currentUser.id.slice(0,8))">👥 Referral</button>
      <button onclick="doLogout()" style="background:#ffe5e5">Logout</button>
    </div>
    <!-- rest of your dashboard content -->
    <div class="grid">
      <!-- rest of your grid content -->
      <div class="card" id="withdrawSection" style="display:none;margin-top:14px">
        <h3>Withdraw</h3>
        <label for="amount">Amount:</label>
        <input type="number" id="amount" placeholder="Enter amount">
        <label for="currency">Currency:</label>
        <select id="currency">
          <option value="EUR">EUR</option>
        </select>
        <button class="green" id="withdrawBtn" onclick="requestWithdrawal()">Withdraw</button>
        <div id="withdrawStatus" style="color:#c00;font-size:14px;min-height:18px;text-align:center"></div>
        <div id="withdrawList" style="font-size:13px;color:#444;margin-top:10px"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // your existing script content
    async function requestWithdrawal() {
      const amount = parseFloat(document.getElementById('amount').value);
      const currency = document.getElementById('currency').value;

      if (!amount || amount <= 0) {
        document.getElementById('withdrawStatus').innerText = 'Enter a valid amount';
        return;
      }

      if (amount > earned) {
        document.getElementById('withdrawStatus').innerText = 'Insufficient balance';
        return;
      }

      try {
        // Save withdraw request to Supabase
        const { data, error } = await client
          .from('withdrawals')
          .insert([
            {
              user_id: currentUser.id,
              currency,
              amount,
              status: 'pending',
            },
          ]);

        if (error) throw error;

        // Update balance
        earned -= amount;
        await saveBalance();
        updateDisplay();

        document.getElementById('withdrawStatus').innerText = 'Withdraw request submitted successfully!';
        loadWithdrawals();
      } catch (error) {
        document.getElementById('withdrawStatus').innerText = 'Error submitting withdraw request.';
        console.error(error);
      }
    }

    async function loadWithdrawals(){
      try{
        if(!currentUser) return;
        let { data } = await client.from('withdrawals').select('*').eq('user_id', currentUser.id).order('created_at',{ascending:false}).limit(5);
        if(!data) return;
        document.getElementById('withdrawList').innerHTML = data.map(w=>'• €'+w.amount+' '+w.currency+' - <b>'+w.status+'</b>').join('<br>') || 'No withdrawals yet';
      }catch(e){}
    }
  </script>
</body>
</html>
