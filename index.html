<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags and styles -->
</head>
<body>
    <!-- HTML content -->
    <script>
        // Get user ID and API endpoint
        const userId = 'your_user_id'; // Replace with actual user ID
        const apiEndpoint = '/api/balance';

        // Function to load balance
        async function loadBalance() {
            const response = await fetch(`${apiEndpoint}?user_id=${userId}`);
            const data = await response.json();
            document.getElementById('earned').innerText = `€${data.balance.toFixed(2)}`;
            document.getElementById('withdrawBal').innerText = `€${data.balance.toFixed(2)}`;
        }

        // Load balance on page load
        loadBalance();

        // Update balance periodically
        setInterval(loadBalance, 30000); // Update every 30 seconds
    </script>
</body>
</html>
