<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYC & Withdraw - Cedars</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* styles here */
  </style>
</head>
<body>
  <!-- topbar, profile card, kyc card, withdraw card -->
  <div class="topbar">
    <b>Cedars</b>
    <a href="index.html">← Back Home</a>
  </div>

  <!-- PROFILE / STATUS CARD -->
  <div class="card">
    <h2>My Profile</h2>
    <p id="userEmail">Loading...</p>
    <div id="statusBox" class="status none">Checking KYC...</div>
    <button class="btn-grey" onclick="loadProfile()">Refresh Status</button>
  </div>

  <!-- KYC CARD -->
  <div class="card" id="kycCard">
    <h2>KYC Verification</h2>
    <p><small>Upload your ID to unlock withdrawals. Admin must approve.</small></p>

    <label>Full Name</label>
    <input id="fullName" type="text" placeholder="e.g. John Doe">

    <label>ID / Passport Number</label>
    <input id="idNumber" type="text" placeholder="e.g. CM12345678">

    <label>Document Type</label>
    <select id="docType">
      <option>National ID</option>
      <option>Passport</option>
      <option>Driving License</option>
    </select>

    <label>Upload ID Photo (Front)</label>
    <input id="docFile" type="file" accept="image/*,.pdf">

    <label>Selfie Holding ID (Optional but faster approval)</label>
    <input id="selfieFile" type="file" accept="image/*">

    <button class="btn-blue" onclick="submitKYC()">Submit KYC for Verification</button>
    <p id="kycMsg"></p>
  </div>

  <!-- WITHDRAW CARD - £, $ and € -->
  <div class="card">
    <h2>Withdraw</h2>
    <p><small>You must be KYC Verified to withdraw. Choose your currency.</small></p>

    <label>Currency</label>
    <select id="withdrawCurrency" onchange="updateCurrencyLabel()">
      <option value="GBP">£ GBP - British Pounds</option>
      <option value="USD">$ USD - US Dollars</option>
      <option value="EUR">€ EUR - Euros</option>
    </select>

    <label id="amountLabel">Amount (£ GBP)</label>
    <input id="withdrawAmount" type="number" placeholder="e.g. 100" min="1" step="0.01">

    <label>Method</label>
    <select id="withdrawMethod" onchange="updateMethodFields()">
      <option value="Bank Transfer">Bank Transfer</option>
      <option value="PayPal">PayPal</option>
    </select>

    <div id="bankFields">
      <label>Account Name</label>
      <input id="bankName" type="text" placeholder="Name on bank account">
      <label>Bank Account / IBAN / Sort Code</label>
      <input id="bankDetails" type="text" placeholder="e.g. IBAN / Account Number">
    </div>

    <div id="paypalFields" style="display:none;">
      <label>PayPal Email</label>
      <input id="paypalEmail" type="email" placeholder="e.g. you@email.com">
    </div>

    <button class="btn-green" onclick="doWithdraw()">Request Withdraw</button>
    <p id="withdrawMsg"></p>
  </div>

  <script>
    const SUPABASE_URL = "https://ipyvewpjtpgfuqfwizlr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PASTE_YOUR_KEY_HERE";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let currentKycStatus = null;

    function updateCurrencyLabel() {
      const cur = document.getElementById('withdrawCurrency').value;
      const label = document.getElementById('amountLabel');
      if (cur === 'GBP') label.innerText = 'Amount (£ GBP)';
      else if (cur === 'USD') label.innerText = 'Amount ($ USD)';
      else if (cur === 'EUR') label.innerText = 'Amount (€ EUR)';
    }

    function updateMethodFields() {
      const m = document.getElementById('withdrawMethod').value;
      document.getElementById('bankFields').style.display = m === 'Bank Transfer' ? 'block' : 'none';
      document.getElementById('paypalFields').style.display = m === 'PayPal' ? 'block' : 'none';
    }

    async function loadProfile() {
      // load profile code here
    }

    async function submitKYC() {
      // submit KYC code here
    }

    async function doWithdraw() {
      const currency = document.getElementById('withdrawCurrency').value;
      const amount = document.getElementById('withdrawAmount').value;
      const method = document.getElementById('withdrawMethod').value;
      const bankName = document.getElementById('bankName').value.trim();
      const bankDetails = document.getElementById('bankDetails').value.trim();
      const paypalEmail = document.getElementById('paypalEmail').value.trim();

      if (!currentUser) return alert("Please login first");
      if (!amount || amount <= 0) return alert("Enter amount");

      if (method === 'Bank Transfer' && (!bankName || !bankDetails)) return alert("Fill Bank Account Name and Details");
      if (method === 'PayPal' && !paypalEmail) return alert("Enter PayPal Email");

      if (currentKycStatus !== 'verified') {
        document.getElementById('withdrawMsg').innerText = "❌ You must complete KYC and be VERIFIED before withdrawing.";
        alert("Please complete KYC first and wait for approval");
        document.getElementById('kycCard').scrollIntoView({ behavior: 'smooth' });
        return;
      }

      const symbol = currency === 'GBP' ? '£' : currency === 'USD' ? '$' : '€';
      const { error } = await supabase.from('withdrawals').insert({
        user_id: currentUser.id,
        amount: parseFloat(amount),
        currency: currency,
        method: method,
        bank_name: bankName || null,
        bank_details: bankDetails || null,
        paypal_email: paypalEmail || null,
        status: 'pending'
      });

      if (error) {
        document.getElementById('withdrawMsg').innerText = "Withdraw request noted. Error: " + error.message + " - Create 'withdrawals' table in Supabase with currency column";
        return;
      }

      document.getElementById('withdrawMsg').innerText = `✅ Withdraw request sent! ${symbol}${amount} ${currency} via ${method} - Status: PENDING`;
      document.getElementById('withdrawAmount').value = "";
    }

    loadProfile();
  </script>
</body>
</html>
