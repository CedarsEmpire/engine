<!-- LIVE SUPPORT WIDGET - START -->
<div id="live-support-widget" style="position:fixed; bottom:20px; right:20px; z-index:9999; background:white; padding:12px 16px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.2); display:flex; align-items:center; gap:10px; font-family:sans-serif; font-size:14px;">
  <span id="status-light" style="width:14px; height:14px; border-radius:50%; background:gray; display:inline-block;"></span>
  <span id="status-message">Checking support...</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://ipyvewpjtpgfuqfwizlr.supabase.co';
  const supabaseAnonKey = 'PASTE_YOUR_REAL_ANON_KEY_HERE';
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

  async function checkSupport() {
    const light = document.getElementById('status-light');
    const msg = document.getElementById('status-message');
    const { data, error } = await supabaseClient.from('support_settings').select('*').single();
    console.log('support data:', data, 'error:', error);
    if (error || !data) {
      light.style.background = 'red';
      msg.textContent = 'Support Offline';
      return;
    }
    if (data.live_support_enabled) {
      light.style.background = '#00c853';
      msg.textContent = data.welcome_message || 'Live Support Online';
    } else {
      light.style.background = 'red';
      msg.textContent = data.offline_message || 'Support Offline';
    }
  }
  checkSupport();
</script>
<!-- LIVE SUPPORT WIDGET - END -->
